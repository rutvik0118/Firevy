<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="psScreenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="psStandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="psMonitorShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="psBadgeShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Ambient Gears & Circles -->
  <g opacity="0.35" stroke="#93C5FD" stroke-width="2" fill="none">
    <!-- Big Gear Top Left -->
    <circle cx="480" cy="90" r="36" stroke-dasharray="6 4" stroke-width="2.5" />
    <circle cx="480" cy="90" r="16" fill="#E0F2FE" />
    
    <!-- Left Gear -->
    <circle cx="120" cy="220" r="30" stroke-dasharray="5 3" />
    <circle cx="120" cy="220" r="12" fill="#EFF6FF" />

    <!-- Right Gear -->
    <circle cx="530" cy="210" r="32" stroke-dasharray="6 4" />
    <circle cx="530" cy="210" r="14" fill="#E0F2FE" />
  </g>

  <!-- Monitor Stand Base -->
  <ellipse cx="320" cy="390" rx="55" ry="12" fill="url(#psStandGrad)" />
  <path d="M 305 340 L 335 340 L 338 388 L 302 388 Z" fill="url(#psStandGrad)" />

  <!-- ================= DESKTOP COMPUTER MONITOR ================= -->
  <g filter="url(#psMonitorShadow)">
    <!-- Monitor Outer Frame (Dark Slate Bezel) -->
    <rect x="150" y="70" width="340" height="240" rx="14" fill="#1E293B" />
    
    <!-- Monitor Screen Area -->
    <rect x="158" y="78" width="324" height="224" rx="8" fill="url(#psScreenGrad)" />

    <!-- Top Window Title Bar -->
    <rect x="158" y="78" width="324" height="24" fill="#38BDF8" />
    <circle cx="174" cy="90" r="4" fill="#FFFFFF" />
    <circle cx="186" cy="90" r="4" fill="#FFFFFF" />
    <circle cx="198" cy="90" r="4" fill="#FFFFFF" />

    <!-- Left Source Code Lines -->
    <g stroke="#93C5FD" stroke-width="3" stroke-linecap="round">
      <line x1="175" y1="120" x2="270" y2="120" />
      <line x1="175" y1="132" x2="310" y2="132" />
      <line x1="185" y1="144" x2="250" y2="144" />
      <line x1="185" y1="156" x2="285" y2="156" />
      <line x1="175" y1="168" x2="230" y2="168" />
      <line x1="175" y1="180" x2="300" y2="180" />
      <line x1="185" y1="192" x2="260" y2="192" />
      <line x1="175" y1="204" x2="290" y2="204" />
      <line x1="175" y1="216" x2="240" y2="216" />
      <line x1="185" y1="228" x2="280" y2="228" />
      <line x1="175" y1="240" x2="255" y2="240" />
      <line x1="185" y1="252" x2="300" y2="252" />
      <line x1="175" y1="264" x2="240" y2="264" />
      <line x1="175" y1="276" x2="290" y2="276" />
    </g>

    <!-- Center/Right: PrestaShop Logo & Branding -->
    <g transform="translate(325, 140)">
      <!-- PrestaShop Puffi Penguin / Bird Emblem in circle -->
      <circle cx="14" cy="14" r="14" fill="#DF0067" />
      <!-- Bird eye and beak -->
      <circle cx="11" cy="11" r="3" fill="#FFFFFF" />
      <circle cx="11" cy="11" r="1.5" fill="#1E293B" />
      <polygon points="18,10 24,14 18,18" fill="#F59E0B" />
      <path d="M 6 18 C 10 12 18 12 22 18 Z" fill="#FFFFFF" />
      
      <!-- PrestaShop Text -->
      <text x="35" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#1E293B">
        Presta<tspan fill="#DF0067">Shop</tspan>
      </text>
    </g>
  </g>

  <!-- ================= 4 CORNER TECH BADGES ================= -->

  <!-- 1. Top-Left: JavaScript Badge -->
  <g filter="url(#psBadgeShadow)" transform="translate(100, 130)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="#38BDF8" />
    <rect x="0" y="0" width="56" height="14" rx="8" fill="#0284C7" />
    <text x="28" y="38" font-family="monospace, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">JS</text>
    <text x="28" y="48" font-family="sans-serif" font-size="7" font-weight="700" fill="#E0F2FE" text-anchor="middle">JavaScript</text>
  </g>

  <!-- 2. Top-Right: HTML5 Badge -->
  <g filter="url(#psBadgeShadow)" transform="translate(485, 60)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="#38BDF8" />
    <rect x="0" y="0" width="56" height="14" rx="8" fill="#0284C7" />
    <text x="28" y="38" font-family="sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="28" y="48" font-family="sans-serif" font-size="7" font-weight="700" fill="#E0F2FE" text-anchor="middle">HTML</text>
  </g>

  <!-- 3. Bottom-Left: PHP Badge -->
  <g filter="url(#psBadgeShadow)" transform="translate(160, 260)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="#0284C7" />
    <rect x="0" y="0" width="56" height="14" rx="8" fill="#0369A1" />
    <text x="28" y="38" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">PHP</text>
    <text x="28" y="48" font-family="sans-serif" font-size="7" font-weight="700" fill="#E0F2FE" text-anchor="middle">PHP</text>
  </g>

  <!-- 4. Bottom-Right: CSS3 Badge -->
  <g filter="url(#psBadgeShadow)" transform="translate(480, 220)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="#38BDF8" />
    <rect x="0" y="0" width="56" height="14" rx="8" fill="#0284C7" />
    <text x="28" y="38" font-family="sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="28" y="48" font-family="sans-serif" font-size="7" font-weight="700" fill="#E0F2FE" text-anchor="middle">CSS</text>
  </g>
</svg>
