<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="phoneFrameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="screenBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <linearGradient id="badgeBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ambient Circular Backing & Gear Pattern -->
  <g opacity="0.6">
    <!-- Big ambient blue gear -->
    <path d="M 210 90 L 215 82 A 50 50 0 0 1 235 82 L 240 90 A 55 55 0 0 1 255 98 L 265 94 A 50 50 0 0 1 278 107 L 274 117 A 55 55 0 0 1 282 132 L 290 137 A 50 50 0 0 1 290 157 L 282 162 A 55 55 0 0 1 274 177 L 278 187 A 50 50 0 0 1 265 200 L 255 196 A 55 55 0 0 1 240 204 L 235 212 A 50 50 0 0 1 215 212 L 210 204 A 55 55 0 0 1 195 196 L 185 200 A 50 50 0 0 1 172 187 L 176 177 A 55 55 0 0 1 168 162 L 160 157 A 50 50 0 0 1 160 137 L 168 132 A 55 55 0 0 1 176 117 L 172 107 A 50 50 0 0 1 185 94 L 195 98 A 55 55 0 0 1 210 90 Z" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2"/>
    <circle cx="225" cy="147" r="22" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>

    <!-- Small gear right -->
    <circle cx="370" cy="110" r="20" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="370" cy="110" r="8" fill="#E0F2FE" />

    <!-- Big soft backdrop bubble -->
    <circle cx="270" cy="270" r="140" fill="#F0F9FF" />
  </g>

  <!-- Ground Line / Platform Base -->
  <ellipse cx="270" cy="425" rx="220" ry="12" fill="#E2E8F0" opacity="0.7" />
  <line x1="80" y1="425" x2="480" y2="425" stroke="#CBD5E1" stroke-width="2" />

  <!-- ================= LEFT SMARTPHONE ================= -->
  <g filter="url(#phoneShadow)">
    <rect x="170" y="115" width="135" height="260" rx="20" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
    <rect x="176" y="121" width="123" height="248" rx="16" fill="url(#screenBgGrad)" />

    <!-- Speaker / Notch -->
    <rect x="215" y="126" width="45" height="5" rx="2.5" fill="#CBD5E1" />

    <!-- Grid of App Icons inside Left Phone -->
    <!-- Row 1: User / Chat -->
    <rect x="186" y="145" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <circle cx="208" cy="158" r="6" fill="#0284C7" />
    <path d="M 198 174 C 198 168 203 167 208 167 C 213 167 218 168 218 174 Z" fill="#0284C7" />

    <rect x="244" y="145" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <!-- Phone Call icon -->
    <path d="M 262 156 C 260 156 258 158 258 160 C 258 166 264 172 270 172 C 272 172 274 170 274 168 L 271 165 C 270 164 268 164 267 165 L 265 166 C 263 165 261 163 260 161 L 261 159 C 262 158 262 156 261 155 Z" fill="#0284C7" />

    <!-- Row 2: Music / Camera -->
    <rect x="186" y="195" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <!-- Music note -->
    <path d="M 205 219 L 205 205 L 216 202 L 216 216" stroke="#0284C7" stroke-width="2" fill="none" />
    <circle cx="202" cy="219" r="4" fill="#0284C7" />
    <circle cx="213" cy="216" r="4" fill="#0284C7" />

    <rect x="244" y="195" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <!-- Camera icon -->
    <rect x="254" y="207" width="24" height="18" rx="4" fill="#0284C7" />
    <circle cx="266" cy="216" r="4" fill="#FFFFFF" />
    <rect x="260" y="204" width="8" height="3" rx="1.5" fill="#0284C7" />

    <!-- Row 3: Settings / Play Button -->
    <rect x="186" y="245" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <!-- Gear icon -->
    <circle cx="208" cy="264" r="8" stroke="#0284C7" stroke-width="2" fill="none" />
    <circle cx="208" cy="264" r="3" fill="#0284C7" />

    <rect x="244" y="245" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <!-- Play icon -->
    <circle cx="266" cy="264" r="10" fill="#0284C7" />
    <polygon points="263,259 272,264 263,269" fill="#FFFFFF" />

    <!-- Bottom App Navigation Bar inside Left Phone -->
    <rect x="182" y="335" width="110" height="20" rx="6" fill="#E0F2FE" />
    <circle cx="200" cy="345" r="3" fill="#0284C7" />
    <circle cx="225" cy="345" r="3" fill="#0284C7" />
    <circle cx="250" cy="345" r="3" fill="#0284C7" />
    <circle cx="275" cy="345" r="3" fill="#0284C7" />
  </g>

  <!-- ================= RIGHT SMARTPHONE ================= -->
  <g filter="url(#phoneShadow)">
    <rect x="250" y="145" width="130" height="245" rx="20" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
    <rect x="256" y="151" width="118" height="233" rx="16" fill="url(#screenBgGrad)" />

    <!-- Header bar -->
    <rect x="268" y="160" width="40" height="4" rx="2" fill="#BAE6FD" />
    <circle cx="355" cy="162" r="3" fill="#0284C7" />

    <!-- Content card in Right Phone -->
    <rect x="265" y="175" width="100" height="36" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <circle cx="280" cy="193" r="7" fill="#0284C7" />
    <rect x="295" y="188" width="55" height="4" rx="2" fill="#94A3B8" />
    <rect x="295" y="196" width="35" height="3" rx="1.5" fill="#CBD5E1" />

    <!-- Music / Audio waveform inside Right phone -->
    <rect x="265" y="220" width="100" height="40" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <circle cx="280" cy="240" r="7" fill="#38BDF8" />
    <path d="M 276 244 L 276 236 L 284 234 L 284 242" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
    <!-- Audio bars -->
    <rect x="296" y="235" width="3" height="10" rx="1.5" fill="#0284C7" />
    <rect x="303" y="230" width="3" height="20" rx="1.5" fill="#0284C7" />
    <rect x="310" y="233" width="3" height="14" rx="1.5" fill="#0284C7" />
    <rect x="317" y="228" width="3" height="24" rx="1.5" fill="#0284C7" />
    <rect x="324" y="236" width="3" height="8" rx="1.5" fill="#0284C7" />
    <rect x="331" y="232" width="3" height="16" rx="1.5" fill="#0284C7" />

    <!-- Grid / Gallery icons -->
    <rect x="265" y="270" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <circle cx="287" cy="289" r="6" fill="#0284C7" />

    <rect x="320" y="270" width="45" height="38" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <rect x="330" y="280" width="24" height="18" rx="4" fill="#0284C7" />
    <circle cx="342" cy="289" r="4" fill="#FFFFFF" />

    <!-- Bottom Indicator -->
    <rect x="290" y="372" width="50" height="3" rx="1.5" fill="#94A3B8" />
  </g>

  <!-- ================= MALE DEVELOPER (LEFT) ================= -->
  <g>
    <!-- Shadow -->
    <ellipse cx="140" cy="425" rx="24" ry="6" fill="#CBD5E1" opacity="0.8" />
    
    <!-- Shoes -->
    <path d="M 120 422 L 132 422 L 134 425 L 118 425 Z" fill="#1E293B" />
    <path d="M 148 422 L 160 422 L 162 425 L 146 425 Z" fill="#1E293B" />
    
    <!-- Pants / Legs (Dark slate trousers) -->
    <path d="M 125 330 L 135 330 L 133 422 L 122 422 Z" fill="#1E293B" />
    <path d="M 142 330 L 152 330 L 158 422 L 148 422 Z" fill="#1E293B" />

    <!-- Torso / Shirt (Blue long-sleeve) -->
    <path d="M 120 280 L 158 280 L 152 335 L 125 335 Z" fill="#0284C7" />

    <!-- Left Arm & Hand holding phone -->
    <path d="M 122 282 L 105 320 L 112 324 L 126 295 Z" fill="#0284C7" />
    <!-- Left Hand -->
    <circle cx="106" cy="324" r="5" fill="#FED7AA" />

    <!-- Right Arm holding phone/gesturing -->
    <path d="M 155 282 L 168 315 L 160 320 L 148 295 Z" fill="#0284C7" />
    <circle cx="167" cy="318" r="5" fill="#FED7AA" />
    <!-- Small Smartphone in hand -->
    <rect x="165" y="310" width="8" height="15" rx="2" fill="#0F172A" />

    <!-- Head & Neck -->
    <rect x="135" y="268" width="8" height="14" fill="#FED7AA" />
    <circle cx="139" cy="254" r="14" fill="#FED7AA" />
    
    <!-- Hair (Dark modern side part) -->
    <path d="M 125 252 C 125 240 134 238 148 240 C 154 242 155 248 153 255 C 148 248 135 248 130 255 Z" fill="#0F172A" />
  </g>

  <!-- ================= FEMALE DEVELOPER (RIGHT) ================= -->
  <g>
    <!-- Shadow -->
    <ellipse cx="385" cy="425" rx="24" ry="6" fill="#CBD5E1" opacity="0.8" />

    <!-- Shoes -->
    <path d="M 364 422 L 374 422 L 375 425 L 362 425 Z" fill="#1E293B" />
    <path d="M 392 422 L 402 422 L 403 425 L 390 425 Z" fill="#1E293B" />

    <!-- Pants / Legs (Dark trousers) -->
    <path d="M 368 335 L 378 335 L 374 422 L 365 422 Z" fill="#1E293B" />
    <path d="M 386 335 L 396 335 L 401 422 L 392 422 Z" fill="#1E293B" />

    <!-- Torso / Top (Navy / Cyan outfit) -->
    <path d="M 368 280 L 402 280 L 396 340 L 368 340 Z" fill="#0F172A" />
    <polygon points="380,280 390,280 385,296" fill="#38BDF8" />

    <!-- Head & Neck -->
    <rect x="382" y="268" width="6" height="14" fill="#FED7AA" />
    <circle cx="385" cy="254" r="13" fill="#FED7AA" />

    <!-- Long Dark Hair -->
    <path d="M 372 250 C 372 238 382 236 395 238 C 402 242 402 258 400 275 C 396 280 392 280 390 262 C 385 248 376 250 374 260 Z" fill="#0F172A" />

    <!-- Arms holding Open Laptop / Tablet -->
    <path d="M 370 285 L 350 312 L 358 316 L 378 295 Z" fill="#0F172A" />
    <path d="M 398 285 L 380 312 L 372 308 L 388 290 Z" fill="#0F172A" />
    
    <!-- Open Laptop / Tablet in Hands -->
    <polygon points="338,318 368,306 376,322 344,332" fill="#93C5FD" stroke="#38BDF8" stroke-width="1.5" />
    <polygon points="344,332 376,322 384,330 352,340" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5" />
  </g>
</svg>
