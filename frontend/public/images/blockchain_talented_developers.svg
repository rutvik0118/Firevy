<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" fill="none" class="w-full h-auto">
  <defs>
    <filter id="shadowTalent" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#006095" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadowTalent" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="nftShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#006095"/>
    </linearGradient>
  </defs>

  <!-- Background Connecting Nodes & Circuits -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.7">
    <path d="M 120 180 H 220 V 260 H 120 Z"/>
    <path d="M 580 180 H 480 V 260 H 580 Z"/>
    <path d="M 120 340 H 220 V 420 H 120 Z"/>
    <path d="M 580 340 H 480 V 420 H 580 Z"/>
    <line x1="220" y1="220" x2="260" y2="220"/>
    <line x1="480" y1="220" x2="440" y2="220"/>
    <line x1="220" y1="380" x2="260" y2="380"/>
    <line x1="480" y1="380" x2="440" y2="380"/>
  </g>

  <!-- Center Monitor & Stand -->
  <g filter="url(#shadowTalent)">
    <path d="M 320 400 L 380 400 L 370 440 L 330 440 Z" fill="#94A3B8"/>
    <ellipse cx="350" cy="440" rx="55" ry="10" fill="#64748B"/>
    <rect x="200" y="150" width="300" height="250" rx="14" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <rect x="210" y="160" width="280" height="220" rx="8" fill="#1E293B"/>

    <!-- NFT Shield on Monitor -->
    <path d="M 350 185 L 405 208 V 265 C 405 300 350 328 350 328 C 350 328 295 300 295 265 V 208 Z" fill="url(#nftShieldGrad)" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="350" y="260" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle">NFT</text>

    <!-- Padlock at base of Shield -->
    <rect x="338" y="295" width="24" height="20" rx="3" fill="#FFFFFF"/>
    <path d="M 344 295 V 286 C 344 282.5 346.5 280 350 280 C 353.5 280 356 282.5 356 286 V 295" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Left Developer: Woman holding NFT badge -->
  <g transform="translate(230, 240)">
    <circle cx="20" cy="18" r="10" fill="#FCA5A5"/>
    <path d="M 10 16 C 10 6 30 6 30 16 Z" fill="#1E293B"/>
    <!-- Body -->
    <path d="M 8 36 C 8 26 32 26 32 36 V 95 H 8 Z" fill="#0083B0"/>
    <!-- Hands holding NFT card -->
    <rect x="30" y="32" width="45" height="30" rx="6" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
    <text x="52" y="51" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">NFT</text>
    <!-- Legs -->
    <rect x="12" y="95" width="7" height="60" fill="#0F172A"/>
    <rect x="21" y="95" width="7" height="60" fill="#0F172A"/>
  </g>

  <!-- Right Developer: Man holding NFT badge -->
  <g transform="translate(420, 240)">
    <circle cx="20" cy="18" r="10" fill="#FCA5A5"/>
    <path d="M 10 14 C 12 6 28 6 30 14 Z" fill="#0F172A"/>
    <!-- Body -->
    <path d="M 8 36 C 8 26 32 26 32 36 V 95 H 8 Z" fill="#006095"/>
    <!-- Hands holding NFT card -->
    <rect x="-35" y="32" width="45" height="30" rx="6" fill="#006095" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-13" y="51" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">NFT</text>
    <!-- Legs -->
    <rect x="12" y="95" width="7" height="60" fill="#0F172A"/>
    <rect x="21" y="95" width="7" height="60" fill="#0F172A"/>
  </g>

  <!-- FLOATING BADGES (Floating around screen) -->
  <!-- Top Left: Video Reel Badge -->
  <g filter="url(#badgeShadowTalent)" transform="translate(130, 150)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#0284C7"/>
    <circle cx="22" cy="22" r="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="19,16 28,22 19,28" fill="#FFFFFF"/>
  </g>

  <!-- Top Right: Audio / Music Badge -->
  <g filter="url(#badgeShadowTalent)" transform="translate(530, 150)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#38BDF8"/>
    <path d="M 18 28 V 18 L 30 14 V 24 M 18 24 C 18 26 16 28 14 28 C 12 28 10 26 10 24 C 10 22 12 20 14 20 C 16 20 18 22 18 24 M 30 20 C 30 22 28 24 26 24 C 24 24 22 22 22 20 C 22 18 24 16 26 16 C 28 16 30 18 30 20" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Middle Right: Ethereum Badge -->
  <g filter="url(#badgeShadowTalent)" transform="translate(530, 240)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#006095"/>
    <polygon points="22,10 32,24 22,20 12,24" fill="#FFFFFF"/>
    <polygon points="22,22 32,25 22,34 12,25" fill="#E2E8F0"/>
  </g>

  <!-- Bottom Left: Gaming Joystick Badge -->
  <g filter="url(#badgeShadowTalent)" transform="translate(130, 270)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#0284C7"/>
    <rect x="12" y="16" width="20" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="16" cy="22" r="2" fill="#FFFFFF"/>
    <circle cx="28" cy="20" r="1.5" fill="#FFFFFF"/>
    <circle cx="25" cy="24" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Right: Chip / Circuit Badge -->
  <g filter="url(#badgeShadowTalent)" transform="translate(530, 330)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#0D9488"/>
    <rect x="16" y="16" width="12" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="22" y1="10" x2="22" y2="16" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="22" y1="28" x2="22" y2="34" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="10" y1="22" x2="16" y2="22" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="28" y1="22" x2="34" y2="22" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
