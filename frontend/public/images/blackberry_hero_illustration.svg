<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="100%" fill="none">
  <!-- Subtle Background Gears / Cogwheels -->
  <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" opacity="0.7">
    <!-- Top Right Gear -->
    <circle cx="360" cy="110" r="45" fill="none" />
    <circle cx="360" cy="110" r="20" fill="none" />
    <path d="M 360 55 L 360 165 M 305 110 L 415 110 M 321 71 L 399 149 M 321 149 L 399 71" />

    <!-- Bottom Left Gear -->
    <circle cx="120" cy="330" r="35" fill="none" />
    <circle cx="120" cy="330" r="15" fill="none" />
    <path d="M 120 285 L 120 375 M 75 330 L 165 330 M 89 299 L 151 361 M 89 361 L 151 299" />
  </g>

  <!-- Monitor Base & Stand -->
  <rect x="235" y="325" width="50" height="40" fill="#CBD5E1" rx="4" />
  <ellipse cx="260" cy="365" rx="70" ry="12" fill="#94A3B8" />

  <!-- Main Desktop Monitor Outer Frame -->
  <rect x="110" y="115" width="300" height="210" rx="14" fill="#0F172A" />
  <!-- Monitor Screen Frame -->
  <rect x="118" y="123" width="284" height="194" rx="8" fill="#FFFFFF" />

  <!-- Browser Window Header & Dots -->
  <rect x="118" y="123" width="284" height="24" rx="8" fill="#F8FAFC" />
  <circle cx="134" cy="135" r="4" fill="#EF4444" />
  <circle cx="146" cy="135" r="4" fill="#F59E0B" />
  <circle cx="158" cy="135" r="4" fill="#10B981" />
  <line x1="118" y1="147" x2="402" y2="147" stroke="#E2E8F0" stroke-width="1" />

  <!-- Screen Content: Code Lines Skeleton -->
  <rect x="135" y="165" width="80" height="8" rx="3" fill="#38BDF8" />
  <rect x="135" y="180" width="140" height="6" rx="3" fill="#E2E8F0" />
  <rect x="135" y="193" width="110" height="6" rx="3" fill="#CBD5E1" />
  <rect x="135" y="206" width="160" height="6" rx="3" fill="#E2E8F0" />
  
  <!-- Screen Content: BlackBerry Logo & Text in Center -->
  <g transform="translate(195, 230)">
    <!-- BlackBerry 7-dot Icon -->
    <g fill="#000000">
      <rect x="0" y="2" width="6" height="6" rx="1.5" />
      <rect x="7" y="2" width="6" height="6" rx="1.5" />
      <rect x="3.5" y="9" width="6" height="6" rx="1.5" />
      <rect x="10.5" y="9" width="6" height="6" rx="1.5" />
      <rect x="0" y="16" width="6" height="6" rx="1.5" />
      <rect x="7" y="16" width="6" height="6" rx="1.5" />
    </g>
    <!-- BlackBerry Text Logo -->
    <text x="22" y="19" fill="#000000" font-size="18" font-weight="900" font-family="sans-serif" letter-spacing="-0.5">BlackBerry</text>
  </g>

  <!-- Lower Screen Skeleton Lines -->
  <rect x="135" y="270" width="220" height="6" rx="3" fill="#E2E8F0" />
  <rect x="135" y="283" width="180" height="6" rx="3" fill="#CBD5E1" />

  <!-- Floating Tech Badge 1: SDK (Top-Right) -->
  <g transform="translate(370, 90)">
    <rect x="0" y="0" width="65" height="50" rx="10" fill="#38BDF8" />
    <rect x="18" y="8" width="28" height="18" rx="4" fill="#006095" opacity="0.3" />
    <text x="32.5" y="22" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif">SDK</text>
    <text x="32.5" y="38" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800" font-family="sans-serif">SDK</text>
  </g>

  <!-- Floating Tech Badge 2: SQL (Middle-Left) -->
  <g transform="translate(70, 160)">
    <rect x="0" y="0" width="60" height="50" rx="10" fill="#7DD3FC" />
    <text x="30" y="22" text-anchor="middle" fill="#006095" font-size="11" font-weight="bold" font-family="sans-serif">SQL</text>
    <text x="30" y="38" text-anchor="middle" fill="#006095" font-size="9" font-weight="bold" font-family="sans-serif">SQL</text>
  </g>

  <!-- Floating Tech Badge 3: Java (Bottom-Left) -->
  <g transform="translate(90, 290)">
    <rect x="0" y="0" width="55" height="48" rx="10" fill="#7DD3FC" />
    <path d="M 27 12 C 27 12, 23 16, 27 20 C 31 24, 25 26, 25 26" stroke="#006095" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="27.5" y="38" text-anchor="middle" fill="#006095" font-size="9" font-weight="bold" font-family="sans-serif">Java</text>
  </g>

  <!-- Floating Tech Badge 4: C++ (Bottom-Right) -->
  <g transform="translate(370, 270)">
    <rect x="0" y="0" width="60" height="50" rx="10" fill="#38BDF8" />
    <text x="30" y="24" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900" font-family="sans-serif">C++</text>
    <text x="30" y="39" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold" font-family="sans-serif">C++</text>
  </g>
</svg>
