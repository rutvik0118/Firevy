<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Deep Red Background with rounded corners -->
  <rect width="240" height="240" rx="24" fill="#8B0014"/>
  
  <!-- Monogram White Graphic -->
  <g fill="#FFFFFF" transform="translate(120, 120)">
    <!-- Main Interlinked D H D Monogram Shape -->
    <!-- Outer boundary: Left D shape, Right D shape, connected in middle -->
    <path d="
      M -90 -60
      C -90 -60 -55 -60 -30 -60
      C -15 -60 -5 -50 0 -40
      C 5 -50 15 -60 30 -60
      C 55 -60 90 -60 90 -60
      L 90 -40
      L 70 -40
      L 70 40
      L 90 40
      L 90 60
      C 90 60 55 60 30 60
      C 15 60 5 50 0 40
      C -5 50 -15 60 -30 60
      C -55 60 -90 60 -90 60
      L -90 40
      L -70 40
      L -70 -40
      L -90 -40
      Z
      M -52 -40
      L -52 40
      C -30 40 -15 25 0 0
      C -15 -25 -30 -40 -52 -40
      Z
      M 52 -40
      L 52 40
      C 30 40 15 25 0 0
      C 15 -25 30 -40 52 -40
      Z
    " fill-rule="evenodd"/>

    <!-- Center Cutouts forming the upper and lower triangular arrows & central horizontal bridge -->
    <polygon points="0,-32 -20,-10 20,-10" fill="#8B0014"/>
    <polygon points="0,32 -20,10 20,10" fill="#8B0014"/>
    <rect x="-20" y="-3.5" width="40" height="7" fill="#8B0014"/>
  </g>
</svg>
