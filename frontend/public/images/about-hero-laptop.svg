<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%">
  <defs>
    <!-- Isometric platform gradients -->
    <linearGradient id="platformTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="platformSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="laptopLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="laptopBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <filter id="mainShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ISOMETRIC 3D FLOATING BASE -->
  <g filter="url(#mainShadow)">
    <polygon points="320,40 560,180 320,320 80,180" fill="url(#platformTop)" />
    <polygon points="320,320 560,180 560,205 320,345 80,205 80,180" fill="url(#platformSide)" />
  </g>

  <!-- 3D LAPTOP BODY -->
  <!-- Screen Lid -->
  <polygon points="230,110 470,110 420,270 180,270" fill="url(#laptopLid)" filter="url(#mainShadow)" />
  <!-- Display Screen -->
  <polygon points="242,122 458,122 414,258 198,258" fill="url(#screenGlow)" />
  <!-- Code Mockup Lines on Screen -->
  <rect x="235" y="142" width="155" height="15" rx="3" fill="#E2E8F0" />
  <rect x="235" y="167" width="95" height="10" rx="3" fill="#38BDF8" />
  <rect x="235" y="186" width="130" height="8" rx="2" fill="#BAE6FD" />
  <rect x="235" y="202" width="110" height="8" rx="2" fill="#E2E8F0" />
  <circle cx="390" cy="180" r="16" fill="#FED7AA" opacity="0.8" />

  <!-- Laptop Keyboard Base (Isometric) -->
  <polygon points="180,270 420,270 490,340 250,340" fill="url(#laptopBase)" />
  <polygon points="192,276 408,276 472,334 256,334" fill="#0C4A6E" opacity="0.9" />
  <!-- Touchpad -->
  <polygon points="320,312 390,312 405,330 335,330" fill="#0369A1" />
  <!-- Indicator Lights -->
  <circle cx="210" cy="225" r="11" fill="#FED7AA" opacity="0.9" />
  <circle cx="430" cy="190" r="12" fill="#FED7AA" opacity="0.85" />
  <circle cx="320" cy="330" r="12" fill="#FED7AA" opacity="0.9" />

  <!-- FLOATING TECHNOLOGY BADGES WITH SHADOWS -->
  <!-- 1. JAVA -->
  <g filter="url(#badgeShadow)">
    <rect x="85" y="45" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="125" y="67" font-family="sans-serif" font-size="13" font-weight="800" fill="#2563EB" text-anchor="middle">JAVA</text>
  </g>

  <!-- 2. PHP -->
  <g filter="url(#badgeShadow)">
    <rect x="235" y="25" width="70" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="270" y="47" font-family="sans-serif" font-size="13" font-weight="800" fill="#4F46E5" text-anchor="middle">PHP</text>
  </g>

  <!-- 3. C++ -->
  <g filter="url(#badgeShadow)">
    <rect x="35" y="100" width="65" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="67" y="121" font-family="sans-serif" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">C++</text>
  </g>

  <!-- 4. JAVASCRIPT -->
  <g filter="url(#badgeShadow)">
    <rect x="20" y="165" width="115" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="77" y="187" font-family="sans-serif" font-size="12" font-weight="800" fill="#D97706" text-anchor="middle">JAVASCRIPT</text>
  </g>

  <!-- 5. iOS -->
  <g filter="url(#badgeShadow)">
    <rect x="475" y="60" width="65" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="507" y="81" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">iOS</text>
  </g>

  <!-- 6. Android -->
  <g filter="url(#badgeShadow)">
    <rect x="515" y="115" width="95" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="562" y="137" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#059669" text-anchor="middle">Android</text>
  </g>

  <!-- 7. C# -->
  <g filter="url(#badgeShadow)">
    <rect x="535" y="275" width="65" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="567" y="296" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#9333EA" text-anchor="middle">C#</text>
  </g>

  <!-- 8. .NET -->
  <g filter="url(#badgeShadow)">
    <rect x="475" y="365" width="70" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="510" y="386" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#006B8F" text-anchor="middle">.NET</text>
  </g>
</svg>
