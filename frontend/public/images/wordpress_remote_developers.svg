<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" fill="none">
  <defs>
    <filter id="wpCardGlow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground Line -->
  <line x1="40" y1="410" x2="580" y2="410" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

  <!-- ================= TOP: WORDPRESS LOGO & TEXT ================= -->
  <g transform="translate(180, 20)">
    <!-- WordPress Circle Emblem -->
    <circle cx="30" cy="30" r="24" fill="#00749C" />
    <circle cx="30" cy="30" r="21" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <text x="30" y="39" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">W</text>
    
    <!-- WORDPRESS Text -->
    <text x="70" y="40" font-family="'Georgia', serif" font-size="34" font-weight="900" fill="#00749C" letter-spacing="2">WORDPRESS</text>
  </g>

  <!-- ================= LAPTOP & BROWSER WINDOW (CENTER) ================= -->
  <!-- Laptop Base & Keyboard -->
  <g transform="translate(200, 360)">
    <polygon points="10,25 210,25 225,32 -5,32" fill="#1E293B" />
    <rect x="0" y="32" width="220" height="6" rx="2" fill="#006095" />
  </g>

  <!-- Open Laptop Screen / Browser UI -->
  <g filter="url(#wpCardGlow)" transform="translate(190, 110)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="240" height="260" rx="10" fill="#BAE6FD" />
    <!-- Top Header Bar with 3 dots -->
    <rect x="0" y="0" width="240" height="22" rx="10" fill="#0284C7" />
    <circle cx="14" cy="11" r="3" fill="#FFFFFF" />
    <circle cx="24" cy="11" r="3" fill="#FFFFFF" />
    <circle cx="34" cy="11" r="3" fill="#FFFFFF" />

    <!-- Top Left Code/UI Box -->
    <rect x="15" y="36" width="95" height="55" rx="6" fill="#FFFFFF" opacity="0.9" />
    <line x1="25" y1="50" x2="80" y2="50" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="62" x2="100" y2="62" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="74" x2="65" y2="74" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />

    <!-- Top Right Picture/Card Box with Gear/Icon -->
    <rect x="125" y="36" width="100" height="75" rx="6" fill="#FFFFFF" opacity="0.9" />
    <circle cx="175" cy="65" r="8" fill="#38BDF8" />
    <line x1="140" y1="92" x2="210" y2="92" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />

    <!-- Center Line / Bar -->
    <rect x="15" y="105" width="95" height="20" rx="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="28" cy="115" r="4" fill="#38BDF8" />
    <line x1="40" y1="115" x2="95" y2="115" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bottom Left Card 1: Settings Gear -->
    <rect x="50" y="140" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="70" cy="160" r="7" stroke="#00749C" stroke-width="2.5" fill="none" />
    <circle cx="70" cy="160" r="2" fill="#00749C" />

    <!-- Bottom Left Card 2: Picture / Gallery -->
    <rect x="98" y="140" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="110" cy="150" r="3" fill="#38BDF8" />
    <polygon points="102,174 114,158 126,174" fill="#00749C" />
    <polygon points="118,174 128,164 135,174" fill="#38BDF8" />

    <!-- Bottom Right: Tag Code </> Box -->
    <rect x="145" y="125" width="55" height="55" rx="8" fill="#38BDF8" />
    <text x="172" y="160" font-family="monospace" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- ================= DEVELOPER (LEFT) IN PINK SHIRT ================= -->
  <g transform="translate(130, 205)">
    <!-- Legs & Pants (Dark Navy) -->
    <path d="M 25 105 L 15 200 L 26 200 L 35 105 Z" fill="#1E293B" />
    <path d="M 35 105 L 45 200 L 56 200 L 45 105 Z" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="14" cy="202" rx="9" ry="3.5" fill="#64748B" />
    <ellipse cx="54" cy="202" rx="9" ry="3.5" fill="#64748B" />

    <!-- Torso (Pink / Coral Polo Shirt) -->
    <polygon points="18,30 46,30 43,105 21,105" fill="#F472B6" />

    <!-- Arms Holding Dark Blue Laptop -->
    <path d="M 22 35 L 42 75 L 75 75" stroke="#F472B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="75" cy="75" r="4" fill="#FED7AA" />

    <!-- Open Laptop in hands -->
    <polygon points="55,68 85,68 95,75 60,75" fill="#00749C" />
    <polygon points="82,48 95,75 88,75 75,48" fill="#00749C" />
    <polygon points="77,50 82,50 88,73 83,73" fill="#BAE6FD" />

    <!-- Head & Hair -->
    <rect x="28" y="18" width="8" height="12" fill="#FED7AA" />
    <circle cx="32" cy="14" r="10" fill="#FED7AA" />
    <path d="M 24 14 C 24 2 40 0 42 12 C 38 10 32 10 26 14 Z" fill="#1E293B" />
  </g>

  <!-- ================= DEVELOPER (RIGHT) IN YELLOW SHIRT ================= -->
  <g transform="translate(430, 205)">
    <!-- Legs & Pants (Dark Navy) -->
    <path d="M 25 105 L 20 200 L 30 200 L 35 105 Z" fill="#1E293B" />
    <path d="M 35 105 L 50 200 L 60 200 L 45 105 Z" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="18" cy="202" rx="9" ry="3.5" fill="#64748B" />
    <ellipse cx="58" cy="202" rx="9" ry="3.5" fill="#64748B" />

    <!-- Torso (Yellow / Amber Shirt) -->
    <polygon points="18,30 46,30 43,105 21,105" fill="#FBBF24" />

    <!-- Arms Holding Tablet / Display -->
    <path d="M 20 35 L 5 70 L 18 78" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="18" cy="78" r="4" fill="#FED7AA" />

    <!-- Blue Tablet / Device in hands -->
    <polygon points="0,68 22,62 28,78 6,85" fill="#0284C7" />
    <line x1="3" y1="70" x2="22" y2="70" stroke="#FFFFFF" stroke-width="2" />

    <!-- Head & Hair -->
    <rect x="28" y="18" width="8" height="12" fill="#FED7AA" />
    <circle cx="32" cy="14" r="10" fill="#FED7AA" />
    <path d="M 24 14 C 24 2 40 0 42 12 C 38 10 32 10 26 14 Z" fill="#1E293B" />
  </g>
</svg>
