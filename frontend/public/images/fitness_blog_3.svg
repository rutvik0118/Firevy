<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="secCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="220" r="160" fill="#10B981" opacity="0.18" filter="url(#glow3)" />
  <circle cx="600" cy="200" r="170" fill="#06B6D4" opacity="0.18" filter="url(#glow3)" />

  <!-- Background Data Streams & Grid -->
  <g opacity="0.08" stroke="#34D399" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Center Hero: Biometric Health Data Shield -->
  <g transform="translate(290, 50)">
    <!-- Big Security Shield -->
    <path d="M 110 20 Q 180 30 220 70 Q 220 180 110 280 Q 0 180 0 70 Q 40 30 110 20 Z" 
          fill="url(#secCardGrad)" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow3)" />

    <!-- Biometric Fingerprint Vector inside Shield -->
    <g transform="translate(70, 75)" stroke="#34D399" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 40 10 A 30 30 0 0 1 70 40 A 30 30 0 0 1 40 70" />
      <path d="M 40 20 A 20 20 0 0 1 60 40 A 20 20 0 0 1 40 60" />
      <path d="M 40 30 A 10 10 0 0 1 50 40 A 10 10 0 0 1 40 50" />
      <path d="M 40 10 A 30 30 0 0 0 10 40 A 30 30 0 0 0 25 65" />
      <path d="M 40 20 A 20 20 0 0 0 20 40 A 20 20 0 0 0 30 58" />
      <path d="M 40 30 A 10 10 0 0 0 30 40 A 10 10 0 0 0 35 48" />
      <circle cx="40" cy="40" r="3" fill="#34D399" />
    </g>

    <!-- Medical Health Cross Icon in Front -->
    <g transform="translate(85, 185)">
      <rect width="50" height="50" rx="12" fill="#047857" stroke="#6EE7B7" stroke-width="2" />
      <path d="M 25 12 V 38 M 12 25 H 38" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    </g>

    <text x="110" y="325" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">HIPAA COMPLIANT</text>
    <text x="110" y="345" fill="#6EE7B7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AES-256 Bit Biometric Encryption</text>
  </g>

  <!-- Left Card: Encrypted Cloud Storage Pipeline -->
  <g transform="translate(60, 80)">
    <rect width="190" height="280" rx="18" fill="#06201B" stroke="#059669" stroke-width="1.8" filter="url(#glow3)" />
    <!-- Cloud Icon -->
    <g transform="translate(45, 25)">
      <path d="M 25 45 H 85 A 20 20 0 0 0 85 10 A 28 28 0 0 0 35 15 A 18 18 0 0 0 25 45 Z" fill="#065F46" stroke="#34D399" stroke-width="2" />
      <!-- Lock in Cloud -->
      <rect x="45" y="24" width="16" height="14" rx="3" fill="#34D399" />
      <path d="M 48 24 V 18 A 5 5 0 0 1 58 18 V 24" fill="none" stroke="#34D399" stroke-width="2" />
    </g>

    <text x="95" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SECURE HEALTH VAULT</text>

    <!-- Checklist -->
    <g transform="translate(20, 130)" font-family="sans-serif" font-size="10" fill="#E2E8F0">
      <text x="0" y="0"><tspan fill="#34D399" font-weight="bold">✓ </tspan>End-to-End Encrypted</text>
      <text x="0" y="30"><tspan fill="#34D399" font-weight="bold">✓ </tspan>Zero-Knowledge Keystores</text>
      <text x="0" y="60"><tspan fill="#34D399" font-weight="bold">✓ </tspan>Automated Audit Logs</text>
      <text x="0" y="90"><tspan fill="#34D399" font-weight="bold">✓ </tspan>GDPR &amp; CCPA Ready</text>
    </g>
  </g>

  <!-- Right Card: Security Key & Padlock Badge -->
  <g transform="translate(550, 80)">
    <rect width="190" height="280" rx="18" fill="#06201B" stroke="#059669" stroke-width="1.8" filter="url(#glow3)" />
    
    <!-- Big Security Padlock -->
    <g transform="translate(60, 35)">
      <rect x="10" y="26" width="50" height="42" rx="10" fill="#047857" stroke="#34D399" stroke-width="2.5" />
      <path d="M 22 26 V 15 A 13 13 0 0 1 48 15 V 26" fill="none" stroke="#34D399" stroke-width="4" />
      <circle cx="35" cy="45" r="4" fill="#FFFFFF" />
      <line x1="35" y1="48" x2="35" y2="56" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <text x="95" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DATA INTEGRITY</text>
    
    <g transform="translate(20, 155)">
      <rect width="150" height="45" rx="8" fill="#044E39" stroke="#10B981" stroke-width="1" />
      <text x="75" y="20" fill="#94A3B8" font-family="sans-serif" font-size="8.5" text-anchor="middle">ENCRYPTION PROTOCOL</text>
      <text x="75" y="36" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">TLS 1.3 / SHA-256</text>
    </g>

    <g transform="translate(20, 215)">
      <rect width="150" height="36" rx="8" fill="#022C22" stroke="#059669" stroke-width="1" />
      <text x="75" y="23" fill="#86EFAC" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">🛡️ 100% HIPAA Certified</text>
    </g>
  </g>
</svg>
