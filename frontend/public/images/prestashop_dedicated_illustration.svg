<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="100%" height="100%" fill="none">
  <defs>
    <filter id="psCardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground Line -->
  <line x1="50" y1="395" x2="590" y2="395" stroke="#CBD5E1" stroke-width="2" />

  <!-- Background Gears -->
  <g opacity="0.3" stroke="#38BDF8" stroke-width="2" fill="none">
    <circle cx="480" cy="110" r="24" stroke-dasharray="4 3" />
    <circle cx="150" cy="340" r="16" stroke-dasharray="3 2" />
  </g>

  <!-- ================= CENTER MONITOR DASHBOARD ================= -->
  <!-- Stand -->
  <ellipse cx="320" cy="393" rx="55" ry="8" fill="#006095" opacity="0.8" />
  <rect x="306" y="340" width="28" height="50" fill="#006095" />

  <g filter="url(#psCardShadow)">
    <!-- Monitor Outer Body -->
    <rect x="160" y="100" width="320" height="240" rx="14" fill="#0077B6" />
    <!-- Inner Screen -->
    <rect x="168" y="108" width="304" height="210" rx="8" fill="#0284C7" />

    <!-- Top PrestaShop Pill Badge -->
    <g transform="translate(385, 118)">
      <rect x="0" y="0" width="75" height="20" rx="4" fill="#FFFFFF" />
      <circle cx="10" cy="10" r="5" fill="#DF0067" />
      <text x="20" y="14" font-family="sans-serif" font-size="8" font-weight="900" fill="#1E293B">PrestaShop</text>
    </g>

    <!-- Bar Chart (Top Left) -->
    <g transform="translate(185, 125)">
      <rect x="0" y="35" width="6" height="25" fill="#FFFFFF" opacity="0.9" />
      <rect x="9" y="20" width="6" height="40" fill="#FFFFFF" opacity="0.9" />
      <rect x="18" y="10" width="6" height="50" fill="#FFFFFF" opacity="0.9" />
      <rect x="27" y="25" width="6" height="35" fill="#FFFFFF" opacity="0.9" />
      <rect x="36" y="15" width="6" height="45" fill="#FFFFFF" opacity="0.9" />
      <rect x="45" y="30" width="6" height="30" fill="#FFFFFF" opacity="0.9" />
      <rect x="54" y="8" width="6" height="52" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Line Chart (Center Waves) -->
    <g transform="translate(185, 185)">
      <!-- Line 1 -->
      <path d="M 0 35 L 25 15 L 50 25 L 75 10 L 110 30 L 140 15 L 180 35 L 220 10 L 260 25" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <!-- Line 2 Wave Fill -->
      <path d="M 0 50 Q 40 20 80 40 T 160 30 T 260 40" fill="none" stroke="#38BDF8" stroke-width="2" />
    </g>

    <!-- Dashboard Bottom Left Grid -->
    <g transform="translate(185, 250)">
      <rect x="0" y="0" width="100" height="55" rx="4" fill="#006095" opacity="0.7" />
      <line x1="8" y1="12" x2="60" y2="12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="22" x2="80" y2="22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="32" x2="50" y2="32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Donut / Pie Chart (Bottom Center) -->
    <g transform="translate(320, 275)">
      <!-- Pie slice 1 -->
      <path d="M 0 0 L 0 -22 A 22 22 0 0 1 22 0 Z" fill="#BAE6FD" />
      <!-- Pie slice 2 -->
      <path d="M 0 0 L 22 0 A 22 22 0 0 1 -15 15 Z" fill="#FFFFFF" />
      <!-- Pie slice 3 -->
      <path d="M 0 0 L -15 15 A 22 22 0 0 1 0 -22 Z" fill="#005580" />
    </g>

    <!-- Horizontal Lines (Bottom Right) -->
    <g transform="translate(360, 260)">
      <line x1="0" y1="5" x2="90" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="14" x2="70" y2="14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="23" x2="85" y2="23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="32" x2="60" y2="32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- ================= FEMALE DEVELOPER (LEFT) ================= -->
  <g transform="translate(100, 195)">
    <!-- Legs & Shoes -->
    <line x1="26" y1="120" x2="24" y2="195" stroke="#FED7AA" stroke-width="6" stroke-linecap="round" />
    <line x1="38" y1="120" x2="40" y2="195" stroke="#FED7AA" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="22" cy="197" rx="8" ry="3" fill="#64748B" />
    <ellipse cx="44" cy="197" rx="8" ry="3" fill="#64748B" />

    <!-- Skirt (Black) -->
    <polygon points="18,65 46,65 52,120 12,120" fill="#0F172A" />

    <!-- Torso (Light Blue Shirt) -->
    <polygon points="20,18 44,18 46,65 18,65" fill="#38BDF8" />

    <!-- Arms & Pointing Hand -->
    <path d="M 20 25 L 5 55 L 12 75" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Arm pointing at screen -->
    <path d="M 44 25 L 75 40 L 105 32" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="105" cy="32" r="3.5" fill="#FED7AA" />

    <!-- Head & Hair -->
    <rect x="28" y="6" width="8" height="12" fill="#FED7AA" />
    <circle cx="32" cy="4" r="10" fill="#FED7AA" />
    <circle cx="30" cy="-2" r="12" fill="#0F172A" />
    <path d="M 20 -2 C 20 -15 45 -15 45 4 L 40 18 L 22 18 Z" fill="#0F172A" />
  </g>

  <!-- ================= MALE DEVELOPER (RIGHT) ================= -->
  <g transform="translate(480, 205)">
    <!-- Legs & Pants (Dark Navy) -->
    <path d="M 25 105 L 20 185 L 28 185 L 35 105 Z" fill="#1E293B" />
    <path d="M 35 105 L 45 185 L 53 185 L 43 105 Z" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="18" cy="187" rx="9" ry="3" fill="#64748B" />
    <ellipse cx="50" cy="187" rx="9" ry="3" fill="#64748B" />

    <!-- Torso (Yellow / Mustard Polo Shirt) -->
    <polygon points="18,30 46,30 43,105 21,105" fill="#F59E0B" />

    <!-- Arms Holding Tablet / Laptop -->
    <path d="M 22 35 L 5 65 L 18 75" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="18" cy="75" r="3.5" fill="#FED7AA" />

    <!-- Laptop / Tablet in hands -->
    <polygon points="0,68 18,62 25,75 5,82" fill="#38BDF8" />
    <line x1="3" y1="70" x2="20" y2="70" stroke="#FFFFFF" stroke-width="2" />

    <!-- Head & Hair -->
    <rect x="28" y="18" width="8" height="12" fill="#FED7AA" />
    <circle cx="32" cy="14" r="10" fill="#FED7AA" />
    <!-- Dark/Brown Hair -->
    <path d="M 24 14 C 24 2 40 0 42 12 C 38 10 32 10 26 14 Z" fill="#1E293B" />
  </g>
</svg>
