<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="100%" fill="none">
  <!-- Soft Background Blob -->
  <ellipse cx="260" cy="220" rx="190" ry="140" fill="#EBF8FF" />

  <!-- Isometric Network Grid Lines -->
  <g stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8">
    <path d="M 120 320 L 260 380 L 400 320 L 260 260 Z" />
    <line x1="260" y1="260" x2="260" y2="120" />
    <line x1="120" y1="320" x2="120" y2="200" />
    <line x1="400" y1="320" x2="400" y2="200" />
  </g>

  <!-- Laptop Base (Isometric View) -->
  <path d="M 140 280 L 260 330 L 380 280 L 260 240 Z" fill="#94A3B8" />
  <path d="M 140 280 L 260 330 L 260 340 L 140 290 Z" fill="#64748B" />
  <path d="M 260 330 L 380 280 L 380 290 L 260 340 Z" fill="#475569" />

  <!-- Laptop Screen Outer Frame -->
  <path d="M 190 140 L 330 140 L 330 250 L 190 250 Z" fill="#0F172A" />
  <path d="M 196 146 L 324 146 L 324 244 L 196 244 Z" fill="#0284C7" />

  <!-- Laptop Keyboard Base Wireframe Lines -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.6">
    <line x1="180" y1="270" x2="340" y2="270" />
    <line x1="190" y1="280" x2="330" y2="280" />
    <line x1="200" y1="290" x2="320" y2="290" />
  </g>

  <!-- AI Chatbot Avatar Figure sitting on Screen/Laptop -->
  <g transform="translate(260, 150)">
    <!-- Robot Head -->
    <rect x="-24" y="-30" width="48" height="38" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
    <rect x="-18" y="-24" width="36" height="20" rx="6" fill="#0F172A" />
    <!-- Eyes -->
    <circle cx="-8" cy="-14" r="4" fill="#38BDF8" />
    <circle cx="8" cy="-14" r="4" fill="#38BDF8" />
    <!-- Antenna -->
    <line x1="0" y1="-30" x2="0" y2="-40" stroke="#0284C7" stroke-width="3" />
    <circle cx="0" cy="-42" r="4" fill="#EF4444" />

    <!-- Robot Body / Torso -->
    <path d="M -20 12 L 20 12 L 26 50 L -26 50 Z" fill="#0284C7" />
    <rect x="-12" y="20" width="24" height="20" rx="4" fill="#FFFFFF" />
    <circle cx="0" cy="30" r="4" fill="#006095" />

    <!-- Ears / Headphones -->
    <rect x="-30" y="-20" width="8" height="18" rx="3" fill="#EF4444" />
    <rect x="22" y="-20" width="8" height="18" rx="3" fill="#EF4444" />
  </g>

  <!-- Floating Chat Bubble with Music Notes (Top-Left) -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="45" height="38" rx="10" fill="#EF4444" />
    <path d="M 12 14 L 28 14 M 16 22 L 24 22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Floating Text / Book Badge (Top-Right) -->
  <g transform="translate(340, 120)">
    <rect x="0" y="0" width="48" height="55" rx="8" fill="#6366F1" />
    <text x="24" y="32" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="sans-serif">T</text>
  </g>

  <!-- Floating AI Badge Box (Bottom-Right) -->
  <g transform="translate(330, 240)">
    <rect x="0" y="0" width="60" height="55" rx="8" fill="#006095" />
    <text x="30" y="34" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="900" font-family="sans-serif">AI</text>
  </g>

  <!-- Floating Headphones (Bottom-Left) -->
  <g transform="translate(100, 240)">
    <circle cx="20" cy="20" r="14" stroke="#006095" stroke-width="3" fill="none" />
    <rect x="4" y="14" width="8" height="14" rx="3" fill="#006095" />
    <rect x="28" y="14" width="8" height="14" rx="3" fill="#006095" />
  </g>

  <!-- Floating Brain Icon (Bottom Center Right) -->
  <g transform="translate(360, 310)">
    <circle cx="20" cy="20" r="16" fill="#F472B6" />
    <path d="M 12 18 C 12 14, 20 12, 24 16 C 28 12, 34 16, 32 24 C 30 28, 20 30, 12 24 Z" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
