<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="phoneBorderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="phoneScreenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="devShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Gears & Bubbles -->
  <g opacity="0.65">
    <!-- Left Cogs/Gear -->
    <path d="M 190 280 L 195 273 A 40 40 0 0 1 210 273 L 215 280 A 45 45 0 0 1 228 288 L 236 284 A 40 40 0 0 1 247 296 L 243 305 A 45 45 0 0 1 249 319 L 257 323 A 40 40 0 0 1 257 341 L 249 345 A 45 45 0 0 1 243 359 L 247 368 A 40 40 0 0 1 236 380 L 228 376 A 45 45 0 0 1 215 384 L 210 391 A 40 40 0 0 1 195 391 L 190 384 A 45 45 0 0 1 177 376 L 169 380 A 40 40 0 0 1 158 368 L 162 359 A 45 45 0 0 1 156 345 L 148 341 A 40 40 0 0 1 148 323 L 156 319 A 45 45 0 0 1 162 305 L 158 296 A 40 40 0 0 1 169 284 L 177 288 A 45 45 0 0 1 190 280 Z" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2"/>
    <circle cx="202" cy="332" r="18" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>

    <!-- Right Small Gear -->
    <circle cx="430" cy="310" r="24" stroke="#BAE6FD" stroke-width="2.5" stroke-dasharray="5 4" fill="#F0F9FF" />
    <circle cx="430" cy="310" r="10" fill="#E0F2FE" />
  </g>

  <!-- Ground Shadow Base -->
  <ellipse cx="310" cy="420" rx="200" ry="12" fill="#E2E8F0" opacity="0.75" />

  <!-- ================= CENTRAL IPHONE FRAME ================= -->
  <g filter="url(#devShadow)">
    <!-- Outer Bezel -->
    <rect x="235" y="55" width="150" height="295" rx="24" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
    
    <!-- Screen -->
    <rect x="242" y="62" width="136" height="281" rx="18" fill="url(#phoneScreenGrad)" stroke="#E2E8F0" stroke-width="1" />

    <!-- Speaker Bar -->
    <rect x="285" y="70" width="50" height="4" rx="2" fill="#CBD5E1" />

    <!-- Screen UI Elements -->
    <!-- Top Left Wireframe Box -->
    <rect x="252" y="85" width="40" height="30" rx="4" fill="#BAE6FD" stroke="#93C5FD" stroke-width="1" />
    <line x1="256" y1="92" x2="288" y2="92" stroke="#0284C7" stroke-width="1.5" />
    <line x1="256" y1="98" x2="280" y2="98" stroke="#0284C7" stroke-width="1.5" />
    <line x1="256" y1="104" x2="284" y2="104" stroke="#0284C7" stroke-width="1.5" />

    <!-- Top Right Blue Solid Block -->
    <rect x="298" y="85" width="68" height="30" rx="4" fill="#0284C7" />

    <!-- Middle Big Wireframe Preview Block -->
    <rect x="252" y="125" width="114" height="60" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="258" y="132" width="48" height="46" rx="4" fill="#BAE6FD" opacity="0.8" />
    <rect x="312" y="136" width="46" height="6" rx="3" fill="#CBD5E1" />
    <rect x="312" y="148" width="34" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="312" y="158" width="40" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="312" y="168" width="26" height="5" rx="2.5" fill="#0284C7" />

    <!-- Middle Dashed Container -->
    <rect x="252" y="195" width="114" height="40" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-dasharray="3 3" stroke-width="1.2" />
    <rect x="260" y="205" width="22" height="20" rx="4" fill="#FDE68A" />

    <!-- Horizontal Wireframe Lines -->
    <rect x="252" y="246" width="30" height="18" rx="4" fill="#BAE6FD" />
    <line x1="256" y1="251" x2="278" y2="251" stroke="#0284C7" stroke-width="1.5" />
    <line x1="256" y1="257" x2="274" y2="257" stroke="#0284C7" stroke-width="1.5" />

    <line x1="292" y1="250" x2="362" y2="250" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="292" y1="258" x2="352" y2="258" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bottom App Navigation Mock -->
    <rect x="252" y="278" width="114" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <line x1="260" y1="292" x2="358" y2="292" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />

    <!-- Home Indicator -->
    <rect x="285" y="332" width="50" height="3" rx="1.5" fill="#94A3B8" />
  </g>

  <!-- ================= FLOATING BADGES AROUND PHONE ================= -->
  <!-- 1. Top-Left Floating Avatar Badge -->
  <g filter="url(#devShadow)">
    <circle cx="230" cy="80" r="16" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="230" cy="76" r="6" fill="#FFFFFF" />
    <path d="M 220 90 C 220 84 224 83 230 83 C 236 83 240 84 240 90 Z" fill="#FFFFFF" />
  </g>

  <!-- 2. Top-Right Floating Chat Badge (...) -->
  <g filter="url(#devShadow)">
    <rect x="382" y="105" width="34" height="24" rx="6" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="392" cy="117" r="2" fill="#FFFFFF" />
    <circle cx="399" cy="117" r="2" fill="#FFFFFF" />
    <circle cx="406" cy="117" r="2" fill="#FFFFFF" />
  </g>

  <!-- 3. Bottom-Right Floating Avatar Badge -->
  <g filter="url(#devShadow)">
    <circle cx="396" cy="272" r="14" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="396" cy="268" r="5" fill="#FFFFFF" />
    <path d="M 388 281 C 388 276 391 275 396 275 C 401 275 404 276 404 281 Z" fill="#FFFFFF" />
  </g>

  <!-- 4. Bottom-Left Floating Chat Badge (...) -->
  <g filter="url(#devShadow)">
    <rect x="245" y="322" width="30" height="22" rx="5" fill="#93C5FD" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="253" cy="333" r="1.8" fill="#FFFFFF" />
    <circle cx="260" cy="333" r="1.8" fill="#FFFFFF" />
    <circle cx="267" cy="333" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- ================= FEMALE DEVELOPER (LEFT) ================= -->
  <g>
    <!-- Foot Shadows -->
    <ellipse cx="204" cy="420" rx="14" ry="4" fill="#CBD5E1" />
    <ellipse cx="225" cy="420" rx="14" ry="4" fill="#CBD5E1" />

    <!-- Heels / Shoes -->
    <polygon points="198,416 206,416 204,420 197,420" fill="#0F172A" />
    <polygon points="219,416 227,416 225,420 218,420" fill="#0F172A" />

    <!-- Bare Legs -->
    <rect x="201" y="360" width="7" height="56" fill="#FED7AA" />
    <rect x="221" y="360" width="7" height="56" fill="#FED7AA" />

    <!-- Navy Pencil Skirt -->
    <polygon points="194,295 236,295 230,362 200,362" fill="#1E3A8A" />

    <!-- Light Blue Blouse / Shirt -->
    <polygon points="198,235 232,235 236,296 194,296" fill="#93C5FD" />
    <!-- V-neck collar & tie -->
    <polygon points="211,235 219,235 215,255" fill="#FFFFFF" />

    <!-- Left Arm (Hand on Hip) -->
    <path d="M 198 238 L 182 270 L 195 285" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="195" cy="285" r="4.5" fill="#FED7AA" />

    <!-- Right Arm (Relaxed beside body) -->
    <path d="M 232 238 L 244 268 L 238 290" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="238" cy="290" r="4.5" fill="#FED7AA" />

    <!-- Neck & Face -->
    <rect x="212" y="222" width="6" height="14" fill="#FED7AA" />
    <circle cx="215" cy="212" r="12" fill="#FED7AA" />

    <!-- Dark Styled Hair -->
    <path d="M 203 210 C 203 198 212 195 226 197 C 232 201 232 215 229 230 C 224 220 212 216 206 226 Z" fill="#0F172A" />
    <path d="M 203 210 C 203 226 200 236 197 245 C 202 245 206 235 208 220 Z" fill="#0F172A" />
  </g>

  <!-- ================= MALE DEVELOPER (RIGHT) ================= -->
  <g>
    <!-- Foot Shadows -->
    <ellipse cx="420" cy="420" rx="16" ry="4" fill="#CBD5E1" />
    <ellipse cx="448" cy="420" rx="16" ry="4" fill="#CBD5E1" />

    <!-- Shoes -->
    <path d="M 412,416 L 426,416 L 428,420 L 410,420 Z" fill="#0F172A" />
    <path d="M 440,416 L 454,416 L 456,420 L 438,420 Z" fill="#0F172A" />

    <!-- Dark Navy Trousers / Legs -->
    <path d="M 418 300 L 430 300 L 424 416 L 414 416 Z" fill="#1E3A8A" />
    <path d="M 434 300 L 446 300 L 452 416 L 442 416 Z" fill="#1E3A8A" />

    <!-- Torso / Blue Shirt -->
    <polygon points="415,235 452,235 446,305 418,305" fill="#60A5FA" />

    <!-- Left Arm & Hand pointing to screen -->
    <path d="M 418 240 L 375 220" stroke="#60A5FA" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Pointing Hand & Extended Finger -->
    <circle cx="372" cy="219" r="4.5" fill="#FED7AA" />
    <path d="M 372 219 L 360 216" stroke="#FED7AA" stroke-width="3" stroke-linecap="round" />

    <!-- Right Arm (Resting along side) -->
    <path d="M 450 240 L 458 275 L 454 295" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="454" cy="295" r="4.5" fill="#FED7AA" />

    <!-- Neck & Head -->
    <rect x="428" y="222" width="7" height="14" fill="#FED7AA" />
    <circle cx="432" cy="210" r="13" fill="#FED7AA" />

    <!-- Dark Short Hair (Back/Side Profile) -->
    <path d="M 422 208 C 422 196 432 195 442 197 C 447 200 447 210 445 220 C 440 216 432 216 426 220 Z" fill="#0F172A" />
  </g>
</svg>
