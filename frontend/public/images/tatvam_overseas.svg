<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <rect width="240" height="240" rx="20" fill="#0D0D0D"/>
  <g transform="translate(120, 120)" stroke="#C6A87D" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Petals / Leaves radiating around -->
    <path d="M0 -38 C-12 -65 0 -90 0 -90 C0 -90 12 -65 0 -38 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
    <path d="M0 -38 L0 -82" stroke="#C6A87D" stroke-width="1.8"/>

    <path d="M0 38 C-12 65 0 90 0 90 C0 90 12 65 0 38 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
    <path d="M0 38 L0 82" stroke="#C6A87D" stroke-width="1.8"/>

    <path d="M-38 0 C-65 -12 -90 0 -90 0 C-90 0 -65 12 -38 0 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
    <path d="M-38 0 L-82 0" stroke="#C6A87D" stroke-width="1.8"/>

    <path d="M38 0 C65 -12 90 0 90 0 C90 0 65 12 38 0 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
    <path d="M38 0 L82 0" stroke="#C6A87D" stroke-width="1.8"/>

    <!-- Diagonal Petals -->
    <g transform="rotate(45)">
      <path d="M0 -36 C-10 -58 0 -80 0 -80 C0 -80 10 -58 0 -36 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
      <path d="M0 -36 L0 -72" stroke="#C6A87D" stroke-width="1.6"/>
      <path d="M0 36 C-10 58 0 80 0 80 C0 80 10 58 0 36 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
      <path d="M0 36 L0 72" stroke="#C6A87D" stroke-width="1.6"/>
      <path d="M-36 0 C-58 -10 -80 0 -80 0 C-80 0 -58 10 -36 0 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
      <path d="M-36 0 L-72 0" stroke="#C6A87D" stroke-width="1.6"/>
      <path d="M36 0 C58 -10 80 0 80 0 C80 0 58 10 36 0 Z" fill="#141414" stroke="#C6A87D" stroke-width="2"/>
      <path d="M36 0 L72 0" stroke="#C6A87D" stroke-width="1.6"/>
    </g>

    <!-- Inner Secondary Petals / Star flourish -->
    <g transform="rotate(22.5)">
      <path d="M0 -34 C-6 -50 0 -68 0 -68 C0 -68 6 -50 0 -34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
      <path d="M0 34 C-6 50 0 68 0 68 C0 68 6 50 0 34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
    </g>
    <g transform="rotate(67.5)">
      <path d="M0 -34 C-6 -50 0 -68 0 -68 C0 -68 6 -50 0 -34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
      <path d="M0 34 C-6 50 0 68 0 68 C0 68 6 50 0 34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
    </g>
    <g transform="rotate(112.5)">
      <path d="M0 -34 C-6 -50 0 -68 0 -68 C0 -68 6 -50 0 -34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
      <path d="M0 34 C-6 50 0 68 0 68 C0 68 6 50 0 34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
    </g>
    <g transform="rotate(157.5)">
      <path d="M0 -34 C-6 -50 0 -68 0 -68 C0 -68 6 -50 0 -34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
      <path d="M0 34 C-6 50 0 68 0 68 C0 68 6 50 0 34 Z" fill="none" stroke="#C6A87D" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Central Dark Badge Area -->
  <rect x="25" y="94" width="190" height="48" fill="#0D0D0D"/>
  
  <!-- Text Elements -->
  <g text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Times New Roman', serif" fill="#C6A87D">
    <text x="120" y="117" font-size="25" font-weight="700" letter-spacing="4.5">TATVAM</text>
    <line x1="45" y1="124" x2="195" y2="124" stroke="#C6A87D" stroke-width="1.2"/>
    <text x="120" y="136" font-size="10.5" font-weight="600" letter-spacing="4.8">OVERSEAS</text>
  </g>
</svg>
