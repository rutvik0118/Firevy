  <line x1="355" y1="85" x2="395" y2="85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="355" y1="100" x2="405" y2="100" stroke="#10B981" stroke-width="3" stroke-linecap="round" />

