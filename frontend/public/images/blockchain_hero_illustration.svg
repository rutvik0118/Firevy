<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#006095" flood-opacity="0.12"/>
    </filter>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background gear outlines -->
  <g stroke="#E2E8F0" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="210" cy="110" r="45" stroke-dasharray="8 6"/>
    <circle cx="580" cy="400" r="55" stroke-dasharray="10 8"/>
    <circle cx="160" cy="440" r="35" stroke-dasharray="6 6"/>
  </g>

  <!-- Connecting dashed lines -->
  <path d="M 330 140 L 450 110 L 530 180 M 230 330 L 190 390 M 490 370 L 540 330" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <!-- Computer Monitor Base & Stand -->
  <g filter="url(#shadow)">
    <!-- Stand -->
    <path d="M 320 420 L 380 420 L 370 460 L 330 460 Z" fill="#CBD5E1"/>
    <ellipse cx="350" cy="460" rx="60" ry="12" fill="#94A3B8"/>

    <!-- Outer Bezel -->
    <rect x="190" y="110" width="320" height="310" rx="16" fill="#1E293B" stroke="#334155" stroke-width="4"/>
    <!-- Inner Screen Screen -->
    <rect x="200" y="120" width="300" height="270" rx="8" fill="#FFFFFF"/>
    
    <!-- Screen Header Bar -->
    <rect x="200" y="120" width="300" height="30" rx="8" fill="#F1F5F9"/>
    <circle cx="218" cy="135" r="5" fill="#EF4444"/>
    <circle cx="233" cy="135" r="5" fill="#F59E0B"/>
    <circle cx="248" cy="135" r="5" fill="#10B981"/>

    <!-- Code Mockup Lines inside Monitor -->
    <g fill="#94A3B8" opacity="0.8">
      <!-- Blue Code Header -->
      <rect x="220" y="165" width="140" height="10" rx="4" fill="#0083B0"/>
      <rect x="370" y="165" width="80" height="10" rx="4" fill="#006095"/>
      
      <!-- Indented Code Lines -->
      <rect x="220" y="188" width="220" height="8" rx="3" fill="#E2E8F0"/>
      <rect x="240" y="204" width="180" height="8" rx="3" fill="#38BDF8"/>
      <rect x="240" y="220" width="140" height="8" rx="3" fill="#CBD5E1"/>
      <rect x="260" y="236" width="190" height="8" rx="3" fill="#818CF8"/>
      <rect x="260" y="252" width="110" height="8" rx="3" fill="#CBD5E1"/>
      
      <rect x="240" y="272" width="160" height="8" rx="3" fill="#F472B6"/>
      <rect x="240" y="288" width="200" height="8" rx="3" fill="#CBD5E1"/>
      
      <rect x="220" y="310" width="130" height="8" rx="3" fill="#34D399"/>
      <rect x="220" y="328" width="240" height="8" rx="3" fill="#E2E8F0"/>
      <rect x="220" y="346" width="170" height="8" rx="3" fill="#CBD5E1"/>
      <rect x="220" y="364" width="90" height="8" rx="3" fill="#0083B0"/>
    </g>
  </g>

  <!-- FLOATING BLOCKCHAIN NODE 1: NFT Badge (Top Center Pink) -->
  <g filter="url(#nodeShadow)" transform="translate(425, 75)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#EC4899"/>
    <!-- NFT icon artwork -->
    <rect x="12" y="12" width="32" height="32" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="28" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">NFT</text>
  </g>

  <!-- FLOATING BLOCKCHAIN NODE 2: Blockchain Network Badge (Top Right Teal) -->
  <g filter="url(#nodeShadow)" transform="translate(535, 140)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#0D9488"/>
    <!-- Blockchain nodes connected -->
    <circle cx="28" cy="18" r="5" fill="#FFFFFF"/>
    <circle cx="16" cy="38" r="5" fill="#FFFFFF"/>
    <circle cx="40" cy="38" r="5" fill="#FFFFFF"/>
    <line x1="28" y1="18" x2="16" y2="38" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="28" y1="18" x2="40" y2="38" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="16" y1="38" x2="40" y2="38" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- FLOATING BLOCKCHAIN NODE 3: Smart Contract / Cube (Top Left Purple) -->
  <g filter="url(#nodeShadow)" transform="translate(130, 200)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#8B5CF6"/>
    <!-- 3D Cube Icon -->
    <path d="M 28 14 L 42 22 L 42 38 L 28 46 L 14 38 L 14 22 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="28" y1="14" x2="28" y2="30" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="28" y1="30" x2="42" y2="38" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="28" y1="30" x2="14" y2="38" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- FLOATING BLOCKCHAIN NODE 4: Lock / Security (Bottom Left Yellow) -->
  <g filter="url(#nodeShadow)" transform="translate(175, 360)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#F59E0B"/>
    <!-- Security Lock Icon -->
    <rect x="18" y="26" width="20" height="16" rx="3" fill="#FFFFFF"/>
    <path d="M 22 26 V 20 C 22 16.5 25 14 28 14 C 31 14 34 16.5 34 20 V 26" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <circle cx="28" cy="34" r="2" fill="#F59E0B"/>
  </g>

  <!-- FLOATING BLOCKCHAIN NODE 5: Wallet / Crypto (Bottom Right Blue) -->
  <g filter="url(#nodeShadow)" transform="translate(530, 315)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#0284C7"/>
    <!-- Wallet Icon -->
    <rect x="14" y="18" width="28" height="22" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 32 24 H 42 V 34 H 32 C 30 34 30 24 32 24 Z" fill="#FFFFFF"/>
    <circle cx="36" cy="29" r="2" fill="#0284C7"/>
  </g>
</svg>
