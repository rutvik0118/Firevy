<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="popGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.12"/>
    </filter>

    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Soft Backing Layer -->
  <ellipse cx="320" cy="360" rx="240" ry="25" fill="#E2E8F0" opacity="0.6"/>
  
  <!-- Outer Floating Gear Elements (Sapphire Style) -->
  <g fill="#A5B4FC" opacity="0.75" filter="url(#softShadow)">
    <!-- Gear 1 -->
    <path d="M75,120 L80,120 L82,125 L87,123 L89,127 L84,130 L85,136 L90,138 L88,143 L83,141 L80,145 L82,150 L77,152 L75,147 L70,147 L68,152 L63,150 L65,145 L62,141 L57,143 L55,138 L60,136 L61,130 L56,127 L58,123 L63,125 L65,120 Z" />
    <circle cx="72.5" cy="136" r="6" fill="#F3F4F6"/>
    <!-- Gear 2 -->
    <path d="M105,100 L108,100 L109,103 L113,102 L114,105 L111,107 L111,111 L115,112 L114,115 L110,114 L108,117 L109,120 L106,121 L104,118 L101,118 L99,121 L96,120 L97,117 L95,114 L91,115 L90,112 L94,111 L94,107 L91,105 L92,102 L96,103 L97,100 Z" opacity="0.8"/>
  </g>

  <!-- Top Floating Card 1: CSS {...} -->
  <g filter="url(#shadow)" transform="translate(390, 85)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="#93C5FD" opacity="0.95"/>
    <rect x="0" y="0" width="110" height="18" rx="8" fill="#60A5FA"/>
    <!-- Window controls dots -->
    <circle cx="10" cy="9" r="3" fill="#EF4444"/>
    <circle cx="20" cy="9" r="3" fill="#F59E0B"/>
    <circle cx="30" cy="9" r="3" fill="#10B981"/>
    <!-- Content text -->
    <text x="18" y="48" font-family="monospace" font-weight="bold" font-size="18" fill="#1E3A8A">CSS</text>
    <text x="62" y="48" font-family="monospace" font-weight="bold" font-size="16" fill="#1E40AF">{...}</text>
  </g>

  <!-- Top Floating Card 2: HTML -->
  <g filter="url(#shadow)" transform="translate(460, 160)">
    <rect x="0" y="0" width="115" height="75" rx="8" fill="#BFDBFE" opacity="0.95"/>
    <rect x="0" y="0" width="115" height="18" rx="8" fill="#93C5FD"/>
    <circle cx="10" cy="9" r="3" fill="#EF4444"/>
    <circle cx="20" cy="9" r="3" fill="#F59E0B"/>
    <circle cx="30" cy="9" r="3" fill="#10B981"/>
    <text x="20" y="50" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1D4ED8" letter-spacing="1">HTML</text>
    <!-- Code placeholder lines -->
    <rect x="75" y="38" width="22" height="4" rx="2" fill="#60A5FA"/>
    <rect x="75" y="46" width="18" height="4" rx="2" fill="#93C5FD"/>
  </g>

  <!-- Desk Structure -->
  <!-- Desk Top -->
  <polygon points="170,295 490,295 520,305 140,305" fill="#E2E8F0"/>
  <rect x="140" y="305" width="380" height="12" rx="2" fill="#CBD5E1"/>
  <!-- Desk Legs -->
  <rect x="170" y="317" width="12" height="60" fill="#94A3B8"/>
  <rect x="478" y="317" width="12" height="60" fill="#94A3B8"/>
  <!-- Desk Base crossbar -->
  <rect x="160" y="372" width="330" height="6" fill="#CBD5E1"/>

  <!-- Main Dual Display Screen (Sapphire Large Blue Screen) -->
  <g filter="url(#shadow)">
    <!-- Stand -->
    <rect x="345" y="250" width="20" height="50" fill="#94A3B8"/>
    <ellipse cx="355" cy="300" rx="35" ry="8" fill="#64748B"/>
    
    <!-- Large Curved Monitor Body -->
    <rect x="230" y="110" width="250" height="165" rx="14" fill="#2563EB"/>
    <rect x="236" y="116" width="238" height="153" rx="10" fill="#3B82F6"/>
    
    <!-- Code Lines on Monitor Screen -->
    <!-- Red line -->
    <rect x="255" y="135" width="80" height="5" rx="2.5" fill="#EF4444"/>
    <!-- Yellow lines -->
    <rect x="255" y="148" width="120" height="5" rx="2.5" fill="#F59E0B"/>
    <rect x="270" y="160" width="90" height="5" rx="2.5" fill="#93C5FD"/>
    <rect x="270" y="172" width="110" height="5" rx="2.5" fill="#60A5FA"/>
    <!-- Green line -->
    <rect x="255" y="185" width="140" height="5" rx="2.5" fill="#10B981"/>
    
    <!-- Vertical Divider line on monitor -->
    <line x1="365" y1="125" x2="365" y2="258" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Right Side Code on Screen -->
    <rect x="380" y="135" width="75" height="5" rx="2.5" fill="#FCD34D"/>
    <rect x="380" y="148" width="60" height="5" rx="2.5" fill="#F472B6"/>
    <rect x="395" y="160" width="65" height="5" rx="2.5" fill="#A7F3D0"/>
    <rect x="395" y="172" width="50" height="5" rx="2.5" fill="#93C5FD"/>
    <rect x="380" y="185" width="70" height="5" rx="2.5" fill="#FCA5A5"/>
    <rect x="380" y="198" width="80" height="5" rx="2.5" fill="#34D399"/>
    <rect x="380" y="211" width="55" height="5" rx="2.5" fill="#FBBF24"/>
    <rect x="380" y="224" width="75" height="5" rx="2.5" fill="#60A5FA"/>
  </g>

  <!-- Secondary Front Monitor / Laptop -->
  <g filter="url(#softShadow)" transform="translate(195, 230)">
    <rect x="0" y="0" width="90" height="65" rx="6" fill="#1E293B"/>
    <rect x="4" y="4" width="82" height="57" rx="4" fill="#0F172A"/>
    <!-- Code snippet -->
    <rect x="10" y="12" width="40" height="4" rx="2" fill="#38BDF8"/>
    <rect x="10" y="20" width="60" height="4" rx="2" fill="#818CF8"/>
    <rect x="18" y="28" width="45" height="4" rx="2" fill="#34D399"/>
    <rect x="18" y="36" width="50" height="4" rx="2" fill="#F472B6"/>
    <rect x="10" y="44" width="30" height="4" rx="2" fill="#FBBF24"/>
  </g>

  <!-- Developer Character Sitting on Chair (Sapphire Style: Blue shirt, dark pants, red shoes) -->
  <g id="developer">
    <!-- Office Chair Base & Stem -->
    <rect x="320" y="330" width="8" height="40" fill="#475569"/>
    <path d="M300,370 L348,370 M324,370 L324,360" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="298" cy="372" r="4" fill="#1E293B"/>
    <circle cx="350" cy="372" r="4" fill="#1E293B"/>

    <!-- Chair Seat & Cushion -->
    <rect x="295" y="322" width="58" height="12" rx="6" fill="#CBD5E1"/>

    <!-- Chair Backrest -->
    <rect x="285" y="255" width="14" height="70" rx="6" fill="#94A3B8"/>

    <!-- Legs & Pants (Dark Navy/Slate) -->
    <!-- Thigh (Horizontal) -->
    <rect x="305" y="308" width="65" height="20" rx="10" fill="#1E293B"/>
    <!-- Calf (Vertical) -->
    <rect x="355" y="315" width="20" height="60" rx="10" fill="#1E293B"/>

    <!-- Red Sneakers / Shoes (Sapphire Style Red Shoes) -->
    <path d="M352,370 L390,370 Q395,370 395,374 L395,378 Q395,382 388,382 L352,382 Z" fill="#EF4444"/>
    <rect x="352" y="379" width="43" height="3" fill="#FFFFFF"/>

    <!-- Torso / Blue Shirt (Sapphire Royal Blue Shirt) -->
    <path d="M298,242 C298,225 320,220 345,222 C365,224 372,235 372,255 L370,312 C350,315 315,315 298,308 Z" fill="#2563EB"/>

    <!-- Left Arm & Hand reaching to keyboard/desk -->
    <path d="M340,240 Q380,250 410,268 L420,268" stroke="#2563EB" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="423" cy="268" r="8" fill="#FCA5A5"/>

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="325" y="210" width="12" height="15" fill="#FCA5A5"/>
    <!-- Head Base -->
    <circle cx="330" cy="200" r="18" fill="#FCA5A5"/>
    <!-- Dark Hair (Short stylish hair cut) -->
    <path d="M312,198 C312,180 325,178 338,180 C348,182 350,192 346,202 C342,198 335,195 325,196 C318,197 314,200 312,198 Z" fill="#0F172A"/>

    <!-- Ears & Profile details -->
    <circle cx="320" cy="200" r="4" fill="#F87171"/>
  </g>

  <!-- Keyboard on Desk -->
  <rect x="385" y="292" width="70" height="6" rx="3" fill="#475569"/>
  <rect x="388" y="293" width="64" height="4" rx="2" fill="#94A3B8"/>
</svg>
