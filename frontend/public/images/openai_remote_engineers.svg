<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" fill="none">
  <!-- Soft Background Base Shadow -->
  <ellipse cx="270" cy="350" rx="220" ry="16" fill="#EBF4FA" />

  <!-- Speech Bubble Top Left -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="85" height="52" rx="16" fill="#005F96" />
    <path d="M 40 52 L 28 66 L 52 52 Z" fill="#005F96" />
    <!-- 3 Horizontal Text Lines inside Bubble -->
    <rect x="16" y="16" width="53" height="5" rx="2.5" fill="#FFFFFF" />
    <rect x="16" y="26" width="38" height="5" rx="2.5" fill="#BAE1F5" />
    <rect x="16" y="36" width="46" height="5" rx="2.5" fill="#FFFFFF" />
  </g>

  <!-- Large Computer Monitor & Desk (Center) -->
  <g transform="translate(200, 140)">
    <!-- Desk Top & Legs -->
    <rect x="-10" y="125" width="160" height="8" rx="4" fill="#1E293B" />
    <rect x="10" y="133" width="8" rx="4" y2="190" height="55" fill="#475569" />
    <rect x="122" y="133" width="8" rx="4" y2="190" height="55" fill="#475569" />

    <!-- Monitor Stand -->
    <rect x="58" y="105" width="24" height="22" fill="#64748B" />
    <rect x="42" y="123" width="56" height="4" rx="2" fill="#475569" />

    <!-- Monitor Display Screen -->
    <rect x="0" y="0" width="140" height="108" rx="10" fill="#005F96" stroke="#004D7A" stroke-width="3" />
    <rect x="6" y="6" width="128" height="96" rx="6" fill="#FFFFFF" />

    <!-- Monitor Code/Interface Windows -->
    <rect x="12" y="14" width="50" height="80" rx="4" fill="#F0F7FC" stroke="#BAE1F5" stroke-width="1" />
    <rect x="16" y="20" width="42" height="4" rx="2" fill="#005F96" />
    <rect x="16" y="28" width="34" height="4" rx="2" fill="#0083B0" />
    <rect x="16" y="36" width="38" height="4" rx="2" fill="#38BDF8" />
    <rect x="16" y="44" width="28" height="4" rx="2" fill="#94A3B8" />

    <rect x="68" y="14" width="54" height="45" rx="4" fill="#F0F7FC" stroke="#BAE1F5" stroke-width="1" />
    <rect x="74" y="20" width="42" height="4" rx="2" fill="#005F96" />
    <rect x="74" y="28" width="30" height="4" rx="2" fill="#0083B0" />
    <rect x="74" y="36" width="36" height="4" rx="2" fill="#38BDF8" />
  </g>

  <!-- Left Figure: Female OpenAI Developer with Laptop -->
  <g transform="translate(65, 135)">
    <!-- Hair -->
    <path d="M 24 16 Q 10 30 20 60 Q 32 65 38 45 Q 36 20 24 16 Z" fill="#1E293B" />
    <!-- Head & Face -->
    <circle cx="28" cy="28" r="14" fill="#FDBA74" />
    <!-- Body / Top -->
    <path d="M 14 44 L 42 44 L 46 95 L 10 95 Z" fill="#005F96" />
    <!-- Pants -->
    <rect x="14" y="95" width="12" height="90" fill="#1E293B" />
    <rect x="28" y="95" width="12" height="90" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="18" cy="188" rx="8" ry="4" fill="#005F96" />
    <ellipse cx="36" cy="188" rx="8" ry="4" fill="#005F96" />

    <!-- Holding Laptop -->
    <path d="M 28 60 L 52 68 L 30 78 L 10 70 Z" fill="#64748B" />
    <rect x="26" y="52" width="24" height="16" rx="2" fill="#38BDF8" transform="rotate(12 26 52)" />
  </g>

  <!-- Center Figure: OpenAI AI Robot Assistant -->
  <g transform="translate(160, 150)">
    <!-- Head -->
    <rect x="20" y="0" width="40" height="30" rx="10" fill="#005F96" stroke="#FFFFFF" stroke-width="2" />
    <rect x="25" y="5" width="30" height="20" rx="6" fill="#0F172A" />
    <circle cx="33" cy="15" r="3.5" fill="#38BDF8" />
    <circle cx="47" cy="15" r="3.5" fill="#38BDF8" />

    <!-- Body -->
    <path d="M 15 35 L 65 35 L 60 95 L 20 95 Z" fill="#005F96" stroke="#FFFFFF" stroke-width="2" />
    <rect x="28" y="45" width="24" height="20" rx="4" fill="#EAF6FF" />
    <circle cx="34" cy="55" r="2.5" fill="#0083B0" />
    <circle cx="40" cy="55" r="2.5" fill="#38BDF8" />
    <circle cx="46" cy="55" r="2.5" fill="#22C55E" />

    <!-- Arms extend out -->
    <path d="M 15 42 Q -10 65 10 85" stroke="#005F96" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 65 42 Q 90 65 70 85" stroke="#005F96" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Legs -->
    <rect x="24" y="95" width="10" height="60" fill="#64748B" />
    <rect x="46" y="95" width="10" height="60" fill="#64748B" />
  </g>

  <!-- Right Figure: Male Developer pointing at Monitor -->
  <g transform="translate(390, 135)">
    <!-- Hair -->
    <path d="M 18 10 Q 30 5 36 18 Q 38 28 32 30 Q 18 28 18 10 Z" fill="#1E293B" />
    <!-- Head -->
    <circle cx="26" cy="24" r="13" fill="#FDBA74" />
    <!-- Shirt -->
    <path d="M 10 40 L 42 40 L 38 95 L 12 95 Z" fill="#0083B0" />
    <!-- Pants -->
    <rect x="14" y="95" width="11" height="90" fill="#1E293B" />
    <rect x="27" y="95" width="11" height="90" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="18" cy="188" rx="8" ry="4" fill="#005F96" />
    <ellipse cx="34" cy="188" rx="8" ry="4" fill="#005F96" />

    <!-- Left Arm Pointing Left to Monitor -->
    <path d="M 14 45 Q -20 50 -35 55" stroke="#0083B0" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="-35" cy="55" r="4" fill="#FDBA74" />
  </g>
</svg>
