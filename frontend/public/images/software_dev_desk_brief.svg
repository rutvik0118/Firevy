<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" fill="none">
  <!-- Background Soft Blue Circle Blob -->
  <circle cx="340" cy="220" r="160" fill="#E2F1F9" />

  <!-- Background Gear 1 (Dotted Circle) -->
  <circle cx="410" cy="120" r="65" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="6 6" fill="none" />
  
  <!-- Floating Technology Badges -->
  <!-- Badge 1: Js -->
  <g transform="translate(300, 65)">
    <rect x="0" y="0" width="46" height="40" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))" />
    <text x="23" y="26" text-anchor="middle" fill="#006095" font-size="16" font-weight="800" font-family="system-ui, sans-serif">Js</text>
  </g>

  <!-- Badge 2: </> -->
  <g transform="translate(370, 45)">
    <rect x="0" y="0" width="50" height="42" rx="9" fill="#38BDF8" filter="drop-shadow(0 4px 6px rgba(56,189,248,0.3))" />
    <text x="25" y="28" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="bold" font-family="system-ui, sans-serif">&lt;/&gt;</text>
  </g>

  <!-- Badge 3: {} -->
  <g transform="translate(438, 60)">
    <rect x="0" y="0" width="46" height="40" rx="8" fill="#6366F1" filter="drop-shadow(0 3px 5px rgba(99,102,241,0.3))" />
    <text x="23" y="26" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold" font-family="system-ui, sans-serif">&#123;&#125;</text>
  </g>

  <!-- Dual Monitor Setup on Desk -->
  <!-- Back Monitor 1 (Left) -->
  <rect x="290" y="150" width="130" height="85" rx="6" fill="#0F172A" />
  <rect x="295" y="155" width="120" height="75" rx="4" fill="#38BDF8" />
  <!-- Wireframe lines on Monitor 1 -->
  <line x1="305" y1="170" x2="365" y2="170" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="305" y1="182" x2="400" y2="182" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="305" y1="192" x2="380" y2="192" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Front Main Monitor 2 (Right) -->
  <rect x="335" y="190" width="145" height="95" rx="8" fill="#006095" />
  <rect x="341" y="196" width="133" height="83" rx="5" fill="#FFFFFF" />
  <rect x="341" y="196" width="133" height="18" rx="5" fill="#F1F5F9" />
  <circle cx="352" cy="205" r="3" fill="#EF4444" />
  <circle cx="360" cy="205" r="3" fill="#F59E0B" />
  <circle cx="368" cy="205" r="3" fill="#10B981" />
  <!-- Big Code Symbol inside Front Monitor -->
  <text x="407.5" y="255" text-anchor="middle" fill="#006095" font-size="28" font-weight="bold" font-family="system-ui, sans-serif">&lt;/&gt;</text>

  <!-- Desk Surface -->
  <rect x="230" y="285" width="280" height="12" rx="4" fill="#1E293B" />
  <!-- Desk Stand Leg -->
  <rect x="395" y="297" width="14" height="65" fill="#475569" />
  <rect x="375" y="358" width="54" height="8" rx="2" fill="#334155" />

  <!-- Developer Sitting at Desk (Woman/Man with Glasses) -->
  <g transform="translate(170, 185)">
    <!-- Head & Hair -->
    <circle cx="50" cy="40" r="18" fill="#FDBA74" />
    <path d="M 32 38 C 32 15, 68 15, 68 38 C 65 25, 35 25, 32 38 Z" fill="#0F172A" />
    <!-- Glasses -->
    <circle cx="43" cy="40" r="5" stroke="#0F172A" stroke-width="2" fill="none" />
    <circle cx="57" cy="40" r="5" stroke="#0F172A" stroke-width="2" fill="none" />
    <line x1="48" y1="40" x2="52" y2="40" stroke="#0F172A" stroke-width="2" />
    <!-- Body / Jacket -->
    <path d="M 30 75 Q 30 58 50 58 Q 70 58 70 75 L 68 160 L 32 160 Z" fill="#006095" />
    <!-- Arms typing on desk -->
    <path d="M 30 80 Q 55 95 80 100" stroke="#FDBA74" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>
</svg>
