<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="100%" fill="none">
  <!-- Subtle Background Gears / Cogwheels -->
  <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" opacity="0.7">
    <!-- Top Right Gear -->
    <circle cx="370" cy="100" r="40" fill="none" />
    <circle cx="370" cy="100" r="18" fill="none" />
    <path d="M 370 50 L 370 150 M 320 100 L 420 100 M 335 65 L 405 135 M 335 135 L 405 65" />

    <!-- Bottom Left Gear -->
    <circle cx="110" cy="330" r="35" fill="none" />
    <circle cx="110" cy="330" r="15" fill="none" />
    <path d="M 110 285 L 110 375 M 65 330 L 155 330 M 79 299 L 141 361 M 79 361 L 141 299" />
  </g>

  <!-- Monitor Base & Stand -->
  <rect x="235" y="325" width="50" height="40" fill="#CBD5E1" rx="4" />
  <ellipse cx="260" cy="365" rx="70" ry="12" fill="#94A3B8" />

  <!-- Main Desktop Monitor Outer Frame -->
  <rect x="110" y="115" width="300" height="210" rx="14" fill="#0F172A" />
  <!-- Monitor Screen Frame -->
  <rect x="118" y="123" width="284" height="194" rx="8" fill="#FFFFFF" />

  <!-- Browser Window Header & Dots -->
  <rect x="118" y="123" width="284" height="24" rx="8" fill="#F8FAFC" />
  <circle cx="134" cy="135" r="4" fill="#EF4444" />
  <circle cx="146" cy="135" r="4" fill="#F59E0B" />
  <circle cx="158" cy="135" r="4" fill="#10B981" />
  <line x1="118" y1="147" x2="402" y2="147" stroke="#E2E8F0" stroke-width="1" />

  <!-- Screen Content Left Side: Code Lines Skeleton -->
  <rect x="135" y="165" width="130" height="8" rx="3" fill="#38BDF8" />
  <rect x="135" y="180" width="110" height="6" rx="3" fill="#E2E8F0" />
  <rect x="135" y="193" width="140" height="6" rx="3" fill="#CBD5E1" />
  <rect x="135" y="206" width="90" height="6" rx="3" fill="#E2E8F0" />
  <rect x="135" y="219" width="130" height="6" rx="3" fill="#38BDF8" opacity="0.6" />
  <rect x="135" y="232" width="100" height="6" rx="3" fill="#E2E8F0" />
  <rect x="135" y="245" width="120" height="6" rx="3" fill="#CBD5E1" />
  <rect x="135" y="258" width="140" height="6" rx="3" fill="#E2E8F0" />
  <rect x="135" y="271" width="110" height="6" rx="3" fill="#38BDF8" opacity="0.5" />

  <!-- Screen Content Right Side: Purple Gear with </> icon in center -->
  <g transform="translate(330, 215)">
    <!-- Purple Gear Outer Cog Teeth -->
    <path d="M0 -36 L6 -36 L9 -27 L18 -24 L25 -30 L30 -25 L24 -18 L27 -9 L36 -6 L36 6 L27 9 L24 18 L30 25 L25 30 L18 24 L9 27 L6 36 L-6 36 L-9 27 L-18 24 L-25 30 L-30 25 L-24 18 L-27 9 L-36 6 L-36 -6 L-27 -9 L-24 -18 L-30 -25 L-25 -30 L-18 -24 L-9 -27 Z" fill="#C084FC" />
    <circle cx="0" cy="0" r="26" fill="#A855F7" />
    <text x="0" y="6" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="900" font-family="sans-serif">&lt;/&gt;</text>
  </g>

  <!-- Floating Tech Badge 1: Data Structure (Top-Left) -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="70" height="48" rx="8" fill="#7DD3FC" />
    <!-- Tree Hierarchy Icon -->
    <rect x="30" y="8" width="10" height="8" rx="1.5" fill="#006095" />
    <line x1="35" y1="16" x2="35" y2="22" stroke="#006095" stroke-width="1.5" />
    <line x1="22" y1="22" x2="48" y2="22" stroke="#006095" stroke-width="1.5" />
    <rect x="18" y="22" width="8" height="6" rx="1" fill="#006095" />
    <rect x="44" y="22" width="8" height="6" rx="1" fill="#006095" />
    <text x="35" y="38" text-anchor="middle" fill="#006095" font-size="8" font-weight="bold" font-family="sans-serif">Data Structure</text>
  </g>

  <!-- Floating Tech Badge 2: RPA / AI (Top-Right) -->
  <g transform="translate(370, 90)">
    <rect x="0" y="0" width="60" height="46" rx="8" fill="#38BDF8" />
    <!-- Bot/AI Eye Icon -->
    <circle cx="30" cy="16" r="8" fill="#006095" />
    <circle cx="27" cy="15" r="2" fill="#FFFFFF" />
    <circle cx="33" cy="15" r="2" fill="#FFFFFF" />
    <text x="30" y="36" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="sans-serif">RPA / AI</text>
  </g>

  <!-- Floating Tech Badge 3: SDLC (Bottom-Left) -->
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="55" height="44" rx="8" fill="#7DD3FC" />
    <!-- Code Bracket Icon -->
    <text x="27.5" y="20" text-anchor="middle" fill="#006095" font-size="12" font-weight="900" font-family="sans-serif">&lt;/&gt;</text>
    <text x="27.5" y="34" text-anchor="middle" fill="#006095" font-size="9" font-weight="bold" font-family="sans-serif">SDLC</text>
  </g>

  <!-- Floating Tech Badge 4: Testing (Bottom-Right) -->
  <g transform="translate(365, 260)">
    <rect x="0" y="0" width="60" height="46" rx="8" fill="#7DD3FC" />
    <!-- Checklist Icon -->
    <rect x="18" y="10" width="24" height="16" rx="2" fill="#006095" />
    <path d="M 22 18 L 26 22 L 36 14" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="30" y="37" text-anchor="middle" fill="#006095" font-size="9" font-weight="bold" font-family="sans-serif">Testing</text>
  </g>
</svg>
