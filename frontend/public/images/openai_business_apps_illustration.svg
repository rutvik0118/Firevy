<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%" fill="none">
  <!-- Soft Background Halo / Shadow -->
  <ellipse cx="280" cy="340" rx="230" ry="18" fill="#EBF4FA" />

  <!-- Speech Bubble Top Left -->
  <g transform="translate(100, 45)">
    <rect x="0" y="0" width="60" height="40" rx="12" fill="#FFFFFF" stroke="#005F96" stroke-width="1.5" filter="drop-shadow(0px 4px 8px rgba(0,95,150,0.12))" />
    <path d="M 40 40 L 48 50 L 46 40 Z" fill="#FFFFFF" stroke="#005F96" stroke-width="1.5" stroke-linejoin="round" />
    <rect x="38" y="38" width="9" height="3" fill="#FFFFFF" />
    <circle cx="18" cy="20" r="3.5" fill="#005F96" />
    <circle cx="30" cy="20" r="3.5" fill="#0083B0" />
    <circle cx="42" cy="20" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Speech Bubble Right -->
  <g transform="translate(380, 75)">
    <rect x="0" y="0" width="75" height="45" rx="12" fill="#FFFFFF" stroke="#005F96" stroke-width="1.5" filter="drop-shadow(0px 4px 8px rgba(0,95,150,0.12))" />
    <path d="M 20 45 L 12 55 L 26 45 Z" fill="#FFFFFF" stroke="#005F96" stroke-width="1.5" stroke-linejoin="round" />
    <rect x="18" y="43" width="10" height="3" fill="#FFFFFF" />
    <rect x="14" y="14" width="47" height="4" rx="2" fill="#005F96" />
    <rect x="14" y="24" width="32" height="4" rx="2" fill="#38BDF8" />
  </g>

  <!-- Giant Isometric/Perspective Laptop Screen (Center) -->
  <g transform="translate(80, 80)">
    <!-- Laptop Base Perspective Platform -->
    <path d="M 10 240 L 200 280 L 390 240 L 200 200 Z" fill="#1E293B" />
    <path d="M 10 240 L 200 280 L 200 292 L 10 252 Z" fill="#005F96" />
    <path d="M 200 280 L 390 240 L 390 252 L 200 292 Z" fill="#004D7A" />

    <!-- Laptop Trackpad -->
    <polygon points="170,250 230,250 220,265 180,265" fill="#334155" opacity="0.6" />

    <!-- Laptop Screen Outer Frame -->
    <rect x="50" y="20" width="300" height="190" rx="16" fill="#005F96" stroke="#004D7A" stroke-width="4" />
    <!-- Screen Display Area -->
    <rect x="58" y="28" width="284" height="174" rx="10" fill="#38BDF8" opacity="0.9" />

    <!-- Window Top Header Bar inside Screen -->
    <rect x="58" y="28" width="284" height="24" rx="10" fill="#004D7A" />
    <circle cx="72" cy="40" r="3.5" fill="#FF5F56" />
    <circle cx="82" cy="40" r="3.5" fill="#FFBD2E" />
    <circle cx="92" cy="40" r="3.5" fill="#27C93F" />

    <!-- Window Code Lines on Left of Screen -->
    <rect x="70" y="60" width="70" height="6" rx="3" fill="#FFFFFF" opacity="0.8" />
    <rect x="70" y="72" width="100" height="6" rx="3" fill="#BAE1F5" opacity="0.8" />
    <rect x="70" y="84" width="55" height="6" rx="3" fill="#FFFFFF" opacity="0.8" />
    <rect x="70" y="96" width="85" height="6" rx="3" fill="#BAE1F5" opacity="0.8" />
    <rect x="70" y="108" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.8" />

    <!-- Floating AI Robot Assistant in Center of Laptop Screen -->
    <g transform="translate(165, 35)">
      <!-- Robot Antenna -->
      <line x1="35" y1="-8" x2="35" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <circle cx="35" cy="-12" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.5" />

      <!-- Robot Head -->
      <rect x="10" y="8" width="50" height="36" rx="12" fill="#FFFFFF" stroke="#005F96" stroke-width="2.5" />
      <rect x="16" y="14" width="38" height="24" rx="7" fill="#0F172A" />
      <circle cx="27" cy="26" r="3" fill="#38BDF8" />
      <circle cx="43" cy="26" r="3" fill="#38BDF8" />
      <path d="M 30 32 Q 35 36 40 32" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Robot Body -->
      <path d="M 8 48 C 8 48, 62 48, 62 48 C 68 48, 70 56, 66 85 C 64 100, 56 108, 35 108 C 14 108, 6 100, 4 85 C 0 56, 2 48, 8 48 Z" fill="#005F96" stroke="#FFFFFF" stroke-width="2.5" />
      
      <!-- Robot Chest Meter -->
      <rect x="20" y="60" width="30" height="24" rx="6" fill="#FFFFFF" />
      <rect x="24" y="66" width="22" height="4" rx="2" fill="#0083B0" />
      <rect x="24" y="74" width="16" height="4" rx="2" fill="#22C55E" />

      <!-- Robot Arms (Hovering / Welcoming) -->
      <path d="M 4 56 Q -18 72 0 90" stroke="#005F96" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M 66 56 Q 88 72 70 90" stroke="#005F96" stroke-width="7" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="90" r="5" fill="#FFFFFF" />
      <circle cx="70" cy="90" r="5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Left Figure: Male Developer sitting cross-legged holding smartphone -->
  <g transform="translate(60, 210)">
    <!-- Head & Hair -->
    <circle cx="28" cy="18" r="12" fill="#FDBA74" />
    <path d="M 16 12 Q 28 4 36 12 Q 34 20 28 18 Z" fill="#1E293B" />
    
    <!-- Torso / Orange-Yellow Shirt -->
    <path d="M 12 30 L 44 30 L 40 75 L 16 75 Z" fill="#F97316" />
    
    <!-- Crossed Legs -->
    <path d="M 10 75 C -10 95, 30 110, 45 95 C 60 110, 75 95, 55 75 Z" fill="#E11D48" />
    
    <!-- Hands holding Smartphone -->
    <rect x="22" y="45" width="14" height="22" rx="3" fill="#1E293B" />
    <rect x="24" y="47" width="10" height="18" rx="2" fill="#38BDF8" />
  </g>

  <!-- Right Figure: Female Developer standing holding tablet -->
  <g transform="translate(415, 195)">
    <!-- Hair -->
    <path d="M 22 14 Q 35 10 40 28 Q 42 45 34 50 Q 24 35 22 14 Z" fill="#1E293B" />
    <!-- Head -->
    <circle cx="24" cy="22" r="12" fill="#FDBA74" />
    
    <!-- Yellow/Orange Shirt -->
    <path d="M 10 34 L 38 34 L 42 80 L 12 80 Z" fill="#F59E0B" />
    
    <!-- Blue Pants -->
    <rect x="14" y="80" width="11" height="85" fill="#005F96" />
    <rect x="27" y="80" width="11" height="85" fill="#005F96" />
    
    <!-- Shoes -->
    <ellipse cx="18" cy="167" rx="7" ry="3.5" fill="#1E293B" />
    <ellipse cx="33" cy="167" rx="7" ry="3.5" fill="#1E293B" />

    <!-- Right Arm holding Tablet pointing at Monitor -->
    <path d="M 12 40 L -12 55 L 10 70 Z" fill="#E2E8F0" />
    <rect x="-16" y="45" width="18" height="25" rx="3" fill="#1E293B" transform="rotate(-15 -16 45)" />
    <rect x="-14" y="47" width="14" height="21" rx="2" fill="#38BDF8" transform="rotate(-15 -14 47)" />
  </g>
</svg>
