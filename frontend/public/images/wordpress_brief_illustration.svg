<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%" fill="none">
  <defs>
    <filter id="wpSoftGlow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ground Line -->
  <line x1="40" y1="445" x2="600" y2="445" stroke="#E2E8F0" stroke-width="2" />

  <!-- ================= TOP WALL SHELF WITH BOOKS & GEARS ================= -->
  <!-- Top Shelf Left -->
  <g transform="translate(140, 50)" opacity="0.6">
    <rect x="0" y="24" width="220" height="6" rx="2" fill="#BAE6FD" />
    <polygon points="20,30 25,45 35,45 30,30" fill="#BAE6FD" />
    <polygon points="190,30 195,45 205,45 200,30" fill="#BAE6FD" />
    
    <!-- Books on Shelf -->
    <rect x="15" y="4" width="6" height="20" fill="#E0F2FE" />
    <rect x="23" y="0" width="8" height="24" fill="#BAE6FD" />
    <rect x="33" y="6" width="6" height="18" fill="#E0F2FE" />
    <polygon points="45,24 55,24 62,4 52,4" fill="#BAE6FD" />

    <!-- Ambient Gear on Shelf -->
    <circle cx="95" cy="12" r="10" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="3 2" fill="none" />
    <circle cx="112" cy="14" r="7" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />
  </g>

  <!-- Top Shelf Right (PC Towers) -->
  <g transform="translate(420, 105)" opacity="0.65">
    <rect x="0" y="32" width="160" height="6" rx="2" fill="#BAE6FD" />
    <polygon points="140,38 145,55 155,55 150,38" fill="#BAE6FD" />
    
    <!-- Vertical PC Towers -->
    <rect x="25" y="2" width="22" height="30" rx="2" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
    <circle cx="36" cy="10" r="2" fill="#38BDF8" />
    <line x1="30" y1="18" x2="42" y2="18" stroke="#BAE6FD" stroke-width="1.5" />

    <rect x="52" y="-4" width="24" height="36" rx="2" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
    <circle cx="64" cy="6" r="2" fill="#38BDF8" />
    <line x1="58" y1="16" x2="70" y2="16" stroke="#BAE6FD" stroke-width="1.5" />
    <line x1="58" y1="22" x2="70" y2="22" stroke="#BAE6FD" stroke-width="1.5" />
  </g>

  <!-- ================= DESK & COMPUTER MONITOR ================= -->
  <!-- Long Work Desk Surface -->
  <g transform="translate(145, 340)">
    <rect x="0" y="0" width="310" height="10" rx="3" fill="#006095" />
    <!-- Desk Legs -->
    <rect x="20" y="10" width="8" height="95" fill="#006095" />
    <rect x="280" y="10" width="8" height="95" fill="#006095" />
    <!-- Crossbar -->
    <rect x="20" y="65" width="268" height="5" fill="#006095" />
  </g>

  <!-- Desktop Monitor with WordPress Logo -->
  <g transform="translate(255, 220)" filter="url(#wpSoftGlow)">
    <!-- Stand -->
    <ellipse cx="60" cy="120" rx="24" ry="5" fill="#006095" />
    <rect x="55" y="98" width="10" height="24" fill="#006095" />

    <!-- Screen Outer Frame (Dark Slate) -->
    <rect x="0" y="0" width="120" height="100" rx="6" fill="#1E293B" />
    <!-- Inner Screen Area -->
    <rect x="5" y="5" width="110" height="85" rx="4" fill="#FFFFFF" />

    <!-- Code lines on left of screen -->
    <line x1="12" y1="18" x2="42" y2="18" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="26" x2="52" y2="26" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="34" x2="45" y2="34" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="42" x2="50" y2="42" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="50" x2="38" y2="50" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="58" x2="48" y2="58" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />

    <!-- Center WordPress Logo Circle -->
    <g transform="translate(75, 45)">
      <circle cx="0" cy="0" r="16" fill="#00749C" />
      <circle cx="0" cy="0" r="14" stroke="#FFFFFF" stroke-width="1.5" fill="none" />
      <text x="0" y="6" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">W</text>
    </g>
  </g>

  <!-- Keyboard on Desk in front of Monitor -->
  <rect x="290" y="342" width="50" height="4" rx="1.5" fill="#94A3B8" />

  <!-- ================= LEFT DEVELOPER ON TALL STOOL ================= -->
  <!-- Tall Stool (Blue / Metal Legs) -->
  <g transform="translate(180, 360)">
    <rect x="5" y="0" width="50" height="8" rx="3" fill="#BAE6FD" />
    <line x1="10" y1="8" x2="0" y2="85" stroke="#006095" stroke-width="3.5" stroke-linecap="round" />
    <line x1="50" y1="8" x2="60" y2="85" stroke="#006095" stroke-width="3.5" stroke-linecap="round" />
    <line x1="30" y1="8" x2="30" y2="85" stroke="#006095" stroke-width="3" stroke-linecap="round" />
    <line x1="5" y1="50" x2="55" y2="50" stroke="#006095" stroke-width="2" />
  </g>

  <!-- Left Developer Figure (Sitting facing desk) -->
  <g transform="translate(160, 210)">
    <!-- Legs & Pants (Dark Navy) -->
    <path d="M 40 140 L 70 145 C 80 145 85 155 85 170 L 80 235 L 68 235 L 68 180 L 35 155 Z" fill="#1E293B" />
    <!-- Shoes -->
    <polygon points="68,235 84,235 82,242 66,242" fill="#334155" />
    <rect x="66" y="240" width="18" height="4" rx="1" fill="#FFFFFF" />

    <!-- Torso (Light Blue Shirt) -->
    <path d="M 25 70 C 25 45 40 35 60 35 C 75 35 85 45 85 70 L 75 140 L 35 140 Z" fill="#38BDF8" />

    <!-- Head & Hair -->
    <rect x="52" y="16" width="10" height="18" fill="#FED7AA" />
    <circle cx="58" cy="14" r="14" fill="#FED7AA" />
    <!-- Dark/Black Hair -->
    <path d="M 46 14 C 46 2 54 -2 68 0 C 76 3 76 10 74 18 C 66 12 56 12 50 18 Z" fill="#1E293B" />

    <!-- Arms Holding Document/Tablet Note -->
    <path d="M 60 45 L 85 75 L 105 70" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="105" cy="70" r="5" fill="#FED7AA" />
    
    <!-- Notepad / Tablet in hand -->
    <polygon points="98,58 114,54 118,72 102,76" fill="#BAE6FD" />

    <!-- Coffee Mug on desk near left dev -->
    <g transform="translate(100, 125)">
      <rect x="0" y="0" width="12" height="15" rx="2" fill="#38BDF8" />
      <path d="M 12 3 C 16 3 16 11 12 11" stroke="#38BDF8" stroke-width="2" fill="none" />
    </g>
  </g>

  <!-- ================= RIGHT DEVELOPER IN OFFICE CHAIR ================= -->
  <!-- Modern Executive Blue Office Chair -->
  <g transform="translate(420, 260)" filter="url(#wpSoftGlow)">
    <!-- High Curved Backrest -->
    <path d="M 50 0 C 65 0 70 15 70 60 L 68 95 C 68 110 50 115 25 115 L 0 115 C 0 95 10 95 15 95 L 45 95 C 50 95 50 85 50 70 L 50 0 Z" fill="#60A5FA" />
    
    <!-- Armrest -->
    <rect x="0" y="70" width="40" height="8" rx="4" fill="#1E293B" />
    <rect x="35" y="78" width="6" height="28" fill="#1E293B" />

    <!-- Chair Base & 5-Star Wheels -->
    <rect x="35" y="115" width="8" height="40" fill="#1E293B" />
    <ellipse cx="39" cy="155" rx="30" ry="6" fill="#1E293B" />
    <circle cx="15" cy="158" r="4" fill="#64748B" />
    <circle cx="63" cy="158" r="4" fill="#64748B" />
  </g>

  <!-- Right Developer Figure (Yellow Shirt Sitting & Typing) -->
  <g transform="translate(390, 220)">
    <!-- Legs & Pants (Dark Navy) -->
    <path d="M 35 125 L 0 130 C -8 130 -15 140 -15 155 L -10 225 L 5 225 L 0 170 L 35 150 Z" fill="#1E293B" />
    <!-- Shoes -->
    <polygon points="-12,225 4,225 2,232 -14,232" fill="#334155" />
    <rect x="-14" y="230" width="18" height="4" rx="1" fill="#FFFFFF" />

    <!-- Torso (Yellow / Amber Shirt) -->
    <path d="M 50 65 C 50 40 38 30 20 30 C 5 30 -5 40 -5 65 L 5 130 L 45 130 Z" fill="#FBBF24" />

    <!-- Head & Hair (Turned towards screen) -->
    <rect x="18" y="12" width="10" height="18" fill="#FED7AA" />
    <circle cx="22" cy="10" r="14" fill="#FED7AA" />
    <!-- Dark Hair with Curls/Bangs -->
    <path d="M 10 10 C 10 -2 20 -4 34 -2 C 40 2 40 8 38 16 C 30 10 22 10 16 16 Z" fill="#1E293B" />

    <!-- Arms Reaching Forward towards Keyboard -->
    <path d="M 20 45 L -5 80 L -30 80" stroke="#FBBF24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="-30" cy="80" r="5" fill="#FED7AA" />
  </g>
</svg>
