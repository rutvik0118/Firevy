<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 380" fill="none">
  <!-- Soft Background Gradient/Blob -->
  <ellipse cx="275" cy="190" rx="200" ry="130" fill="#E2F1F9" />
  
  <!-- Outer Light Circles -->
  <circle cx="275" cy="190" r="150" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Laptop Base Desk Shadow -->
  <ellipse cx="275" cy="275" rx="160" ry="14" fill="#CBD5E1" opacity="0.6" />

  <!-- Open Laptop Base -->
  <rect x="130" y="250" width="290" height="14" rx="5" fill="#006095" />
  <path d="M 190 250 L 360 250 L 345 264 L 205 264 Z" fill="#38BDF8" />

  <!-- Laptop Screen Outer Frame -->
  <rect x="160" y="90" width="230" height="160" rx="10" fill="#0F172A" />
  <!-- Laptop Display Screen -->
  <rect x="168" y="98" width="214" height="144" rx="6" fill="#FFFFFF" />

  <!-- Browser Header Bar -->
  <rect x="168" y="98" width="214" height="20" rx="6" fill="#F1F5F9" />
  <circle cx="180" cy="108" r="3.5" fill="#EF4444" />
  <circle cx="190" cy="108" r="3.5" fill="#F59E0B" />
  <circle cx="200" cy="108" r="3.5" fill="#10B981" />

  <!-- Screen Content Layout Boxes -->
  <rect x="180" y="128" width="80" height="55" rx="5" fill="#E0F2FE" stroke="#93C5FD" stroke-width="1" />
  <rect x="270" y="128" width="100" height="55" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />

  <!-- Gear Icon on Window -->
  <circle cx="220" cy="155.5" r="12" fill="#38BDF8" />
  <path d="M220 148.5 L220 162.5 M213 155.5 L227 155.5 M215 150.5 L225 160.5 M215 160.5 L225 150.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Code Badge Box </ > on Screen -->
  <rect x="295" y="193" width="65" height="42" rx="7" fill="#006095" />
  <text x="327.5" y="220" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold" font-family="system-ui, sans-serif">&lt;/&gt;</text>

  <!-- Left Developer Figure (Man standing/leaning holding laptop) -->
  <g transform="translate(45, 120)">
    <!-- Body -->
    <path d="M 50 80 Q 50 60 70 60 Q 90 60 90 80 L 85 170 L 55 170 Z" fill="#006095" />
    <!-- Pants -->
    <path d="M 55 170 L 68 240 L 72 240 L 85 170 Z" fill="#1E293B" />
    <!-- Head & Hair -->
    <circle cx="70" cy="40" r="16" fill="#FDBA74" />
    <path d="M 54 38 Q 70 20 86 38 Q 70 25 54 38 Z" fill="#0F172A" />
    <!-- Laptop in hand -->
    <rect x="80" y="90" width="35" height="24" rx="3" fill="#38BDF8" />
    <rect x="75" y="114" width="45" height="4" rx="1" fill="#0F172A" />
  </g>

  <!-- Right Developer Figure (Man standing looking at screen) -->
  <g transform="translate(390, 125)">
    <!-- Body -->
    <path d="M 40 75 Q 40 55 60 55 Q 80 55 80 75 L 75 165 L 45 165 Z" fill="#0083B0" />
    <!-- Pants -->
    <path d="M 45 165 L 56 235 L 64 235 L 75 165 Z" fill="#0F172A" />
    <!-- Head & Hair -->
    <circle cx="60" cy="35" r="15" fill="#FDBA74" />
    <path d="M 45 33 Q 60 18 75 33 Q 60 22 45 33 Z" fill="#475569" />
    <!-- Arm pointing -->
    <path d="M 45 75 Q 25 90 10 85" stroke="#FDBA74" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Floating Sparkles -->
  <circle cx="120" cy="80" r="4" fill="#38BDF8" />
  <circle cx="440" cy="90" r="5" fill="#F59E0B" />
  <circle cx="275" cy="50" r="4" fill="#006095" />
</svg>
