<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardGlowEffect" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ambient Gears in Background -->
  <g opacity="0.32" stroke="#38BDF8" stroke-width="2" fill="none">
    <circle cx="210" cy="110" r="28" stroke-dasharray="5 3" />
    <circle cx="560" cy="310" r="30" stroke-dasharray="6 4" />
    <circle cx="160" cy="370" r="22" stroke-dasharray="4 2" />
    <circle cx="525" cy="145" r="18" stroke-dasharray="3 2" />
  </g>

  <!-- Ground Line / Desk Surface -->
  <line x1="40" y1="410" x2="620" y2="410" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

  <!-- ================= FLOATING CODE WINDOWS & BADGES ================= -->

  <!-- Top-Center: Blue Window with tabs -->
  <g filter="url(#cardGlowEffect)" transform="translate(230, 60)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#38BDF8" />
    <!-- Header -->
    <rect x="0" y="0" width="200" height="18" rx="8" fill="#0284C7" />
    <circle cx="10" cy="9" r="2.5" fill="#FFFFFF" />
    <circle cx="18" cy="9" r="2.5" fill="#FFFFFF" />
    <circle cx="26" cy="9" r="2.5" fill="#FFFFFF" />

    <!-- Code lines -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
      <line x1="14" y1="32" x2="100" y2="32" />
      <line x1="14" y1="42" x2="140" y2="42" />
      <line x1="24" y1="52" x2="120" y2="52" />
      <line x1="24" y1="62" x2="90" y2="62" />
      <line x1="14" y1="72" x2="150" y2="72" />
      <line x1="14" y1="82" x2="110" y2="82" />
      <line x1="24" y1="92" x2="130" y2="92" />
    </g>
  </g>

  <!-- Bottom-Right: Floating Editor Window -->
  <g filter="url(#cardGlowEffect)" transform="translate(320, 200)">
    <rect x="0" y="0" width="230" height="125" rx="8" fill="#0284C7" />
    <!-- Header -->
    <rect x="0" y="0" width="230" height="20" rx="8" fill="#0369A1" />
    <circle cx="12" cy="10" r="3" fill="#FFFFFF" />
    <circle cx="22" cy="10" r="3" fill="#FFFFFF" />
    <circle cx="32" cy="10" r="3" fill="#FFFFFF" />

    <!-- Tag icon </> in sidebar -->
    <text x="12" y="44" font-family="monospace" font-size="11" font-weight="900" fill="#BAE6FD">&lt;/&gt;</text>

    <!-- Code lines -->
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
      <line x1="42" y1="40" x2="185" y2="40" />
      <line x1="42" y1="52" x2="205" y2="52" />
      <line x1="42" y1="64" x2="165" y2="64" />
      <line x1="42" y1="76" x2="195" y2="76" />
      <line x1="42" y1="88" x2="145" y2="88" />
      <line x1="42" y1="100" x2="180" y2="100" />
    </g>
  </g>

  <!-- Top-Right: HTML Badge -->
  <g filter="url(#cardGlowEffect)" transform="translate(460, 48)">
    <rect x="0" y="0" width="46" height="42" rx="6" fill="#38BDF8" />
    <text x="23" y="26" font-family="monospace" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
    <text x="23" y="56" font-family="sans-serif" font-size="10" font-weight="800" fill="#006095" text-anchor="middle">HTML</text>
  </g>

  <!-- Far Top-Right: CSS Badge -->
  <g filter="url(#cardGlowEffect)" transform="translate(535, 75)">
    <rect x="0" y="0" width="44" height="42" rx="6" fill="#60A5FA" />
    <text x="22" y="27" font-family="monospace" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">{ }</text>
    <text x="22" y="56" font-family="sans-serif" font-size="10" font-weight="800" fill="#006095" text-anchor="middle">CSS</text>
  </g>

  <!-- Mid-Left: JS Badge -->
  <g filter="url(#cardGlowEffect)" transform="translate(180, 180)">
    <text x="18" y="25" font-family="monospace, sans-serif" font-size="32" font-weight="900" fill="#93C5FD">Js</text>
  </g>

  <!-- Mid-Right: </> Tag icon -->
  <g transform="translate(540, 320)">
    <text x="0" y="0" font-family="monospace" font-size="28" font-weight="900" fill="#BAE6FD">&lt;/&gt;</text>
  </g>

  <!-- ================= DEVELOPER GIRL WITH LAPTOP & TABLET (LEFT/CENTER) ================= -->
  
  <!-- Desk Base / Stand Bar -->
  <g transform="translate(340, 360)">
    <rect x="0" y="40" width="240" height="12" rx="4" fill="#006095" />
    <rect x="15" y="52" width="8" height="38" fill="#006095" />
    <rect x="215" y="52" width="8" height="38" fill="#006095" />

    <!-- Open Laptop with Glowing Apple Logo -->
    <!-- Base -->
    <polygon points="10,38 120,38 135,42 -5,42" fill="#1E293B" />
    <!-- Screen Lid -->
    <polygon points="35, -50 115, -50 110, 38 40, 38" fill="#1E293B" />
    <!-- Apple / Logo on Back of Laptop Lid -->
    <circle cx="75" cy="-6" r="8" fill="#FFFFFF" />
    <path d="M 75 -18 C 78 -24 85 -24 82 -18 Z" fill="#FFFFFF" />

    <!-- Tablet / Display Screen on Stand on the Right -->
    <g transform="translate(140, -25)">
      <!-- Screen -->
      <polygon points="0, 15 45, -15 65, 30 15, 60" fill="#0284C7" />
      <polygon points="4, 18 42, -10 60, 28 18, 54" fill="#E0F2FE" />
      <!-- Stand behind tablet -->
      <polygon points="30, 20 45, 60 55, 60 40, 20" fill="#006095" />
    </g>
  </g>

  <!-- Developer Girl Body (Blue Hoodie + Glasses + Ponytail) -->
  <g transform="translate(160, 270)">
    <!-- Body / Blue Hoodie Top -->
    <path d="M 10 135 C 10 65 50 45 110 45 C 170 45 200 65 205 135 Z" fill="#0284C7" />

    <!-- Arm reaching to laptop -->
    <path d="M 120 75 L 180 100 L 225 100" stroke="#0284C7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hand on trackpad -->
    <circle cx="225" cy="100" r="9" fill="#FED7AA" />

    <!-- Light Cyan Hood / Collar detail -->
    <path d="M 70 45 C 70 70 145 70 145 45 Z" fill="#BAE6FD" />

    <!-- Neck -->
    <rect x="98" y="25" width="22" height="24" fill="#FED7AA" />

    <!-- Head -->
    <circle cx="110" cy="14" r="26" fill="#FED7AA" />

    <!-- Round Eyeglasses (Dark Frames) -->
    <circle cx="102" cy="14" r="8" stroke="#0F172A" stroke-width="2.5" fill="none" />
    <circle cx="118" cy="14" r="8" stroke="#0F172A" stroke-width="2.5" fill="none" />
    <line x1="110" y1="14" x2="110" y2="14" stroke="#0F172A" stroke-width="2.5" />

    <!-- Hair (Dark Bob / Tied with Bangs) -->
    <path d="M 80 14 C 80 -18 100 -24 135 -20 C 150 -15 155 0 150 20 C 140 5 125 0 110 5 C 95 0 85 5 80 14 Z" fill="#0F172A" />
    <path d="M 80 14 C 80 32 90 42 94 46 C 88 32 86 20 86 14 Z" fill="#0F172A" />
    <path d="M 138 14 C 138 32 130 42 126 46 C 132 32 134 20 134 14 Z" fill="#0F172A" />
  </g>
</svg>
